title:
  rus: Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан города Экибастуз к 35-летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан
  kaz: Екібастұз қаласының мұқтаж азаматтарының жекелеген санаттарына Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентінің шығарылған күніне 35 жыл толуына арналған қосымша әлеуметтік көмек көрсету туралы
