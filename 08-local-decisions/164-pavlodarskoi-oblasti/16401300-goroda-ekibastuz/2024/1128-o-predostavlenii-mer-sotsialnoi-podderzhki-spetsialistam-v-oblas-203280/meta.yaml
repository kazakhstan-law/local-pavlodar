act_code: '203280'
requisite: Решение Экибастузского городского маслихата Павлодарской области от 28 ноября 2024 года № 201/24
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2025 год
  kaz: 2025 жылы Екібастұз қаласының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы шешімі
