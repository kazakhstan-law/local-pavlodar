  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата от 9 апреля 2026 года № 328/42 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Экибастуза»
