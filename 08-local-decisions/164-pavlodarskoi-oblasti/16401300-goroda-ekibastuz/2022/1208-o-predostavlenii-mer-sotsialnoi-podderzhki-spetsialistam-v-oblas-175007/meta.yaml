  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата от 8 декабря 2022 года № 176/24 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2023 год»
    kaz: Екібастұз қалалық мәслихатының 2022 жылғы 8 желтоқсандағы № 176/24 «2023 жылы Екібастұз қаласының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау  шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
