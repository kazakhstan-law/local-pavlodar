  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата от 3 мая 2019 года № 345/42 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2019 год»
    kaz: Екібастұз қалалық мәслихатының 2019 жылғы 3 мамырдағы «2019 жылға арналған Екібастұз қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 345/42 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134500/rus
