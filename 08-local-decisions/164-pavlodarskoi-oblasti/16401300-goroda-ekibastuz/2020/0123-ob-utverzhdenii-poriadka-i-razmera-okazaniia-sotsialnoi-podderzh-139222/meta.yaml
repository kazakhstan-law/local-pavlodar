  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Экибастуза» от 23 января 2020 года № 414/52
    kaz: Екібастұз қалалық мәслихатының 2020 жылғы 23 қаңтардағы «Екібастұз қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» № 414/52 шешіміне өзгеріс енгізу туралы
