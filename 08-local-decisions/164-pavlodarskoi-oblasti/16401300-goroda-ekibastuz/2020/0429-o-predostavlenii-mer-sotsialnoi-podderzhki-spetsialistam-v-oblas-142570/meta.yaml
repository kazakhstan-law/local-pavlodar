act_code: '142570'
requisite: Решение маслихата города Экибастуза Павлодарской области от 29 апреля 2020 года № 420/53. Зарегистрировано Департаментом юстиции Павлодарской области 5 мая 2020 года № 6824. Утратило силу решением Экибастузского городского маслихата Павлодарской области от 23 декабря 2020 года № 485/63 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2020 год
  kaz: 2020 жылға арналған Екібастұз қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
