act_code: '150985'
requisite: Решение Экибастузского городского маслихата Павлодарской области от 23 декабря 2020 года № 486/63. Зарегистрировано Департаментом юстиции Павлодарской области 30 декабря 2020 года № 7140
title:
  rus: Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах города Экибастуза, а также указанным специалистам, работающим в государственных организациях, финансируемых из местного бюджета
  kaz: Азаматтық қызметшілер болып табылатын және Екібастұз қаласының ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
