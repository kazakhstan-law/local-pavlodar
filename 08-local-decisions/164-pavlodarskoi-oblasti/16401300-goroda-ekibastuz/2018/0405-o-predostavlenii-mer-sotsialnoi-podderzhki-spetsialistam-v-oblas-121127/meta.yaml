requisite: Решение маслихата города Экибастуза Павлодарской области от 5 апреля 2018 года № 231/27. Зарегистрировано Департаментом юстиции Павлодарской области 23 апреля 2018 года № 5960
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2018 год
  kaz: 2018 жылға арналған Екібастұз қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
