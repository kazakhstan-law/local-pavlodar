  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата от 23 января 2018 года № 220/26 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Экибастуза»
    kaz: Екібастұз қалалық мәслихатының 2018 жылғы 23 қаңтардағы № 220/26 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Екібастұз қаласы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешiмiне өзгеріс енгiзу туралы
