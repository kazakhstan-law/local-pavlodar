  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата от 21 декабря 2023 года № 103/12 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2024 год»
    kaz: Екібастұз қалалық мәслихатының 2023 жылғы 21 желтоқсандағы № 103/12 «2024 жылы Екібастұз қаласының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
