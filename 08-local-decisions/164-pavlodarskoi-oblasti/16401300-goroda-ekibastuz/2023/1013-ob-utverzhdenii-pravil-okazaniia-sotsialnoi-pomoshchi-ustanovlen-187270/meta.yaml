  title:
    rus: О внесении изменения в решение Экибастузского городского маслихата от 13 октября 2023 года № 80/8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Экибастуза»
