  title:
    rus: О внесении изменений в решение Экибастузского городского маслихата от 13 октября 2023 года № 80/8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Экибастуза»
    kaz: Екібастұз қалалық мәслихатының 2023 жылғы 13 қазандағы № 80/8 «Әлеуметтiк көмек көрсетудің, оның мөлшерлерiн белгiлеудің және Екібастұз қаласы мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
