  title:
    rus: О внесении дополнений в решение Экибастузского городского маслихата от 25 июня 2015 года № 330/39 «О предоставлении социальной помощи специалистам государственных организаций социального обеспечения, образования, культуры, спорта, проживающим и работающим в сельских населенных пунктах города Экибастуза на приобретение топлива»
    kaz: Екібастұз қалалық мәслихатының 2015 жылғы 25 маусымдағы «Екібастұз қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт мемлекеттік ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы» № 330/39 шешіміне толықтырулар енгізу туралы
