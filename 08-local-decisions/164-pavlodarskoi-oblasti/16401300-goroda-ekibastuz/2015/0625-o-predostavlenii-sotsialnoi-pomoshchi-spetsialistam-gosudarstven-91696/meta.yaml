act_code: '91696'
requisite: Решение маслихата города Экибастуза Павлодарской области от 25 июня 2015 года № 330/39. Зарегистрировано Департаментом юстиции Павлодарской области 13 июля 2015 года № 4593. Утратило силу решением маслихата города Экибастуза Павлодарской области от 23 января 2020 года № 414/52 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи специалистам государственных организаций социального обеспечения, образования, культуры, спорта, ветеринарии, проживающим и работающим в сельских населенных пунктах города Экибастуза на приобретение топлива
  kaz: Екібастұз қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария мемлекеттік ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы
