requisite: Решение маслихата города Экибастуза Павлодарской области от 12 марта 2015 года № 308/35. Зарегистрировано Департаментом юстиции Павлодарской области 27 марта 2015 года № 4394
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2015 год
  kaz: 2015 жылы Екібастұз қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшері туралы
