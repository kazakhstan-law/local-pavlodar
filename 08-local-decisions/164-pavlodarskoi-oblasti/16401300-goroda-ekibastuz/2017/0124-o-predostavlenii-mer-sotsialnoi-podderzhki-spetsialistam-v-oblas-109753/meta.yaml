act_code: '109753'
requisite: Решение маслихата города Экибастуза Павлодарской области от 24 января 2017 года № 98/14. Зарегистрировано Департаментом юстиции Павлодарской области 14 февраля 2017 года № 5379
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2017 год
  kaz: 2017 жылы Екібастұз қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
