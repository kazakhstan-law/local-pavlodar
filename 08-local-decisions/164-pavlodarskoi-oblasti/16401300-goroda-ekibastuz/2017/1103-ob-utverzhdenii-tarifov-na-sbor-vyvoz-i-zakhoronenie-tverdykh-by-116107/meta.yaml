requisite: Решение маслихата города Экибастуза Павлодарской области от 3 ноября 2017 года № 186/22. Зарегистрировано Департаментом юстиции Павлодарской области 21 ноября 2017 года № 5694. Утратило силу решением Экибастузского городского маслихата Павлодарской области от 20 июня 2023 года № 28/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
