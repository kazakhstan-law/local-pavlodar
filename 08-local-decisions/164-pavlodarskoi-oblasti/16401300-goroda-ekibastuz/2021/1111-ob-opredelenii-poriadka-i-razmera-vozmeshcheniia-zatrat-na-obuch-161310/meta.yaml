  title:
    rus: О внесении изменений в решение Экибастузского городского маслихата от 11 ноября 2021 года № 73/11  «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Экибастузе»
    kaz: Екібастұз қалалық мәслихатының 2021 жылғы 11 қарашадағы «Екібастұз қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» № 73/11 шешіміне өзгерістер енгізу туралы
