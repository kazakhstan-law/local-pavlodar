act_code: '155927'
requisite: Решение Экибастузского городского маслихата Павлодарской области от 28 апреля 2021 года № 27/4. Зарегистрировано Департаментом юстиции Павлодарской области 18 мая 2021 года № 7283
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2021 год
  kaz: 2021 жылға арналған Екібастұз қаласының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы
