requisite: Решение маслихата города Экибастуза Павлодарской области от 19 июня 2014 года № 231/30. Зарегистрировано Департаментом юстиции Павлодарской области 23 июля 2014 года № 3889. Утратило силу решением Экибастузского городского маслихата Павлодарской области от 25 августа 2022 года № 137/21 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей улиц для участия в сходе местного сообщества на территории поселка Солнечный города Экибастуза
  kaz: Екібастұз қаласы Солнечный поселкесінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер тұрғындары өкілдерінің санын бекіту туралы
