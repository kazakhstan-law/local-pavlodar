requisite: Решение маслихата города Экибастуза Павлодарской области от 19 июня 2014 года № 236/30. Зарегистрировано Департаментом юстиции Павлодарской области 23 июля 2014 года № 3881. Утратило силу решением Экибастузского городского маслихата Павлодарской области от 21 августа 2020 года № 451/57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
