  title:
    rus: О внесении изменений и дополнений в решение Экибастузского городского  маслихата от 15 апреля 2014 года № 207/26 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Экибастуза"
    kaz: Екібастұз қалалық мәслихатының 2014 жылғы 15 сәуірдегі "Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Екібастұз қаласы мұқтаж азаматтарының жекеленген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" № 207/26 шешіміне өзгерістер және толықтырулар енгізу туралы
