requisite: Решение акима города Экибастуза Павлодарской области от 3 апреля 2003 года № 14. Зарегистрировано Управлением юстиции Павлодарской области 5 мая 2003 года за № 1778. Утратило силу решением акима города Экибастуза Павлодарской области от 27 июля 2009 года № 46
