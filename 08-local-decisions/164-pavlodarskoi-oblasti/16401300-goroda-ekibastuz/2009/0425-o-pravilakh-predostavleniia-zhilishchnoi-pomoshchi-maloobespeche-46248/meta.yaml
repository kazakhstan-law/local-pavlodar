requisite: Решение маслихата города Экибастуза Павлодарской области от 25 апреля 2009 года № 170/16. Зарегистрировано Управлением юстиции города Экибастуза Павлодарской области 28 мая 2009 года за № 12-3-231. Утратило силу решением маслихата города Экибастуза Павлодарской области от 25 декабря 2009 года № 237/19
title:
  rus: О Правилах предоставления жилищной помощи малообеспеченным семьям (гражданам) по оплате содержания жилища, потребления коммунальных услуг и компенсации на ремонт общего имущества объекта кондоминиума по городу Экибастузу
  kaz: Екібастұз қаласы бойынша кондоминиум объектілерінің жалпы мүлкін жөндеуге коммуналды қызметтері мен отемақыны пайдалану, тұрғын үйді күту бойынша аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін беру Ережелері туралы
