act_code: '99026'
requisite: Решение маслихата города Экибастуза Павлодарской области от 2 февраля 2016 года № 379/47. Зарегистрировано Департаментом юстиции Павлодарской области 12 февраля 2016 года № 4923
title:
  rus: 'О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Экибастуза на 2016 год '
  kaz: '2016 жылы Екібастұз қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы '
