act_code: '189386'
requisite: Решение Успенского районного маслихата Павлодарской области от 30 ноября 2023 года № 60/11
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, улиц для участия в сходе местного сообщества на территории Успенского сельского округа Успенского района Павлодарской области
  kaz: Павлодар облысы Успен ауданы Успен ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
