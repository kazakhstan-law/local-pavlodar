    kaz: Успен аудандық мәслихатының 2023 жылғы 30 қарашадағы № 62/11 «Павлодар облысы Успен ауданы Ольгин ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
