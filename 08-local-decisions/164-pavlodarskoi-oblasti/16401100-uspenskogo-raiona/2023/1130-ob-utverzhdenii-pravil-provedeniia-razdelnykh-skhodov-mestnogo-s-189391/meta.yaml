title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц для участия в сходе местного сообщества на территории Ольгинского сельского округа Успенского района Павлодарской области
  kaz: Павлодар облысы Успен ауданы Ольгин ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
