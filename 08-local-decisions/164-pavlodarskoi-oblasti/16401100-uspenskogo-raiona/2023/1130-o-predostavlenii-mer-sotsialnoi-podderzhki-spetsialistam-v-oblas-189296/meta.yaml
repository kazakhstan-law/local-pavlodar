  requisite: Решение Успенского районного маслихата Павлодарской области от 18 октября 2024 года № 124/24
  title:
    rus: О внесении изменения в решение Успенского районного маслихата от 30 ноября 2023 года № 59/11 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Успенского района на 2024 год»
    kaz: Успен аудандық мәслихатының 2023 жылғы 30 қарашадағы № 59/11 «Успен ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға арналған әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201832/rus
