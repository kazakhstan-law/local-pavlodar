  title:
    rus: О внесении изменения в решение Успенского районного маслихата от 5 марта 2019 года № 202/43 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Успенского района на 2019 год»
    kaz: Успен ауданы мәслихатының 2019 жылғы 5 наурыздағы «2019 жылға арналған Успен ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 202/43 шешіміне өзгеріс енгізу туралы
