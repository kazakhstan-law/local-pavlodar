requisite: Решение маслихата Успенского района Павлодарской области от 27 августа 2019 года № 244/50. Зарегистрировано Департаментом юстиции Павлодарской области 3 сентября 2019 года № 6529. Утратило силу решением Успенского районного маслихата Павлодарской области от 25 ноября 2022 года № 127/23 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Успенского района Павлодарской области
  kaz: Павлодар облысы Успен ауданының Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін арттыру туралы
