    kaz: Успен аудандық мәслихатының 2021 жылғы 6 қазандағы № 52/8 «Успен ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшері мен тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
