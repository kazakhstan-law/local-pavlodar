act_code: '117647'
requisite: Решение маслихата Успенского района Павлодарской области от 22 декабря 2017 года № 106/23. Зарегистрировано Департаментом юстиции Павлодарской области 5 января 2018 года № 5784
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Успенского района на 2018 год
  kaz: 2018 жылға арналған Успен ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
