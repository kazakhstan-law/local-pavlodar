act_code: '108704'
requisite: Решение маслихата Успенского района Павлодарской области от 22 декабря 2016 года № 55/11. Зарегистрировано Департаментом юстиции Павлодарской области 6 января 2017 года № 5321
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Успенского района на 2017 год
  kaz: 2017 жылға арналған Успен ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
