act_code: '87655'
requisite: Решение маслихата Успенского района Павлодарской области от 23 февраля 2015 года № 232/42. Зарегистрировано Департаментом юстиции Павлодарской области 17 марта 2015 года № 4374. Утратило силу решением маслихата Успенского района Павлодарской области от 27 декабря 2019 года № 256/54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Успенского района
  kaz: Успен ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдары  мамандарына отын сатып алу бойынша әлеуметтік көмек көрсету туралы
