act_code: '97428'
requisite: Решение маслихата Успенского района Павлодарской области от 21 декабря 2015 года № 280/52. Зарегистрировано Департаментом юстиции Павлодарской области 12 января 2016 года № 4885. Утратило силу решением маслихата Успенского района Павлодарской области от 14 июня 2017 года № 80/17 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Успенского района на 2016 год
  kaz: 2016 жылға арналған Успен ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
