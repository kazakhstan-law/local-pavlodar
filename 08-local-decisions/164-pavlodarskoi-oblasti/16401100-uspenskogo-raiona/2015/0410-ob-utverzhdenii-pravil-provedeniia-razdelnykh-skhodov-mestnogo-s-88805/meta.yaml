requisite: Решение маслихата Успенского района Павлодарской области от 10 апреля 2015 года № 244/44. Зарегистрировано Департаментом юстиции Павлодарской области 17 апреля 2015 года № 4427. Утратило силу решением Успенского районного маслихата Павлодарской области от 15 июля 2020 года № 300/61 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
