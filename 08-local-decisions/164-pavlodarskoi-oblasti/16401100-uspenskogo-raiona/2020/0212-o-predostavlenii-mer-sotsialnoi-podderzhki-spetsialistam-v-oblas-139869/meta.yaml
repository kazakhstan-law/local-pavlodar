act_code: '139869'
requisite: Решение маслихата Успенского района Павлодарской области от 12 февраля 2020 года № 261/55. Зарегистрировано Департаментом юстиции Павлодарской области 24 февраля 2020 года № 6731. Утратило силу решением Успенского районного маслихата Павлодарской области от 23 декабря 2020 года № 337/67 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Успенского района на 2020 год
  kaz: 2020 жылға арналған Успен ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
