act_code: '145228'
requisite: Решение Успенского районного маслихата Павлодарской области от 15 июля 2020 года № 300/61. Зарегистрировано Департаментом юстиции Павлодарской области 30 июля 2020 года № 6877. Утратило силу решением Успенского районного маслихата Павлодарской области от 25 сентября 2023 года № 42/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел и улиц для участия в сходе местного сообщества на территории Успенского сельского округа Успенского района Павлодарской области
  kaz: Павлодар облысы Успен ауданы Успен ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар және көшелер тұрғындары өкілдерінің санын айқындау туралы
