requisite: Решение маслихата Успенского района Павлодарской области от 28 апреля 2020 года № 285/58. Зарегистрировано Департаментом юстиции Павлодарской области 6 мая 2020 года № 6827. Утратило силу решением Успенского районного маслихата Павлодарской области от 25 сентября 2023 года № 42/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей улиц для участия в сходе местного сообщества на территории Равнопольского сельского округа Успенского района Павлодарской области
  kaz: Павлодар облысы Успен ауданы Равнополь ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын бекіту және жергілікті қоғамдастық жиынына қатысу үшін көшелер тұрғындары өкілдерінің санын айқындау туралы
