  title:
    rus: О внесении изменений и дополнения в решение Успенского районного маслихата от 28 апреля 2020 года № 284/58 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Ольгинского сельского округа Успенского района»
    kaz: Успен аудандық мәслихатының 2020 жылғы 28 сәуірдегі № 284/58 «Успен ауданы Ольгин ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы» шешіміне өзгерістер және толықтыру енгізу туралы
