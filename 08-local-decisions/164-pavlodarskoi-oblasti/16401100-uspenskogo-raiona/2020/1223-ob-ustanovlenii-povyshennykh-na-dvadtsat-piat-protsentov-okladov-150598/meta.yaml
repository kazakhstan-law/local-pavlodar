title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения и культуры являющимся гражданскими служащими и работающим в сельских населенных пунктах Успенского района
  kaz: Успен ауданының азаматтық қызметшілері болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласының мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
