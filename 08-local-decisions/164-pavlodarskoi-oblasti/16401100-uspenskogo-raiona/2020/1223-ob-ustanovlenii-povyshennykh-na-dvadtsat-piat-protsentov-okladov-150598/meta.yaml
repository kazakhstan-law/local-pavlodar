  title:
    rus: О внесении изменений в решение Успенского районного маслихата от 23 декабря 2020 года № 336/67 «Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Успенского района, а также указанным специалистам, работающим в государственных организациях, финансируемых из местного бюджета»
    kaz: Успен аудандық мәслихатының 2020 жылғы 23 желтоқсандағы № 336/67 «Азаматтық қызметшілер болып табылатын және Успен ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/175983/rus
