requisite: Решение акима Алгабасского сельского округа города Аксу Павлодарской области от 3 августа 2020 года № 1-04/05. Зарегистрировано Департаментом юстиции Павлодарской области 4 августа 2020 года № 6880. Утратило силу решением акима Алгабасского сельского округа города Аксу Павлодарской области от 25 ноября 2020 года № 1-03/11 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий по бруцеллезу крупного рогатого скота на территории улиц Жанамайдан, Достық, Школьная, Қанаш Қамзин, Гагарина, Абай Құнанбаев села Жолкудук Алгабасского сельского округа города Аксу
  kaz: Ақсу қаласы Алғабас ауылдық округінің Жолқұдық ауылының Жаңамайдан, Достық, Школьная, Қанаш Қамзин, Гагарин, Абай Құнанбаев көшелерінің аумағына ірі қара малдың бруцеллез ауруы бойынша  шектеу іс-шараларын белгілеу туралы
