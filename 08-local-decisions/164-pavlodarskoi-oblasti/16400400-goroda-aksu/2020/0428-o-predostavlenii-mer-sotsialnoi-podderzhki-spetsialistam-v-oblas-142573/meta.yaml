act_code: '142573'
requisite: Решение маслихата города Аксу Павлодарской области от 28 апреля 2020 года № 411/59. Зарегистрировано Департаментом юстиции Павлодарской области 5 мая 2020 года № 6825. Утратило силу решением Аксуского городского маслихата Павлодарской области от 28 октября 2020 года № 465/68 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Аксу в 2020 году
  kaz: 2020 жылы Ақсу қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
