requisite: Решение маслихата города Аксу Павлодарской области от 20 марта 2013 года № 110/14. Зарегистрировано Департаментом юстиции Павлодарской области 22 апреля 2013 года № 3510. Утратило силу решением маслихата города Аксу Павлодарской области от 12 октября 2013 года № 149/20
title:
  rus: О предоставлении права льготного проезда некоторым категориям обучающихся и воспитанников учреждений образования города Аксу на городском общественном транспорте (кроме такси) на 2013 год
  kaz: Ақсу қаласының білім беру мекемелерінің оқушылары мен тәрбиеленушілерінің кейбір санаттарына 2013 жылғы қалалық қоғамдық көлікте (таксиден басқа) жеңілдетілген жол жүру құқығын беру туралы
