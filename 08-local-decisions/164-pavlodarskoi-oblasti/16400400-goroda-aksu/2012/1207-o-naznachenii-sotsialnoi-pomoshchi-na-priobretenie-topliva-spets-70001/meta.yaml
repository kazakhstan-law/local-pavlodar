requisite: Решение маслихата города Аксу Павлодарской области от 07 декабря 2012 года N 78/10. Зарегистрировано Департаментом юстиции Павлодарской области 11 января 2013 года N 3330. Утратило силу решением маслихата города Аксу Павлодарской области от 3 ноября 2017 года № 143/17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликовании)
title:
  rus: О назначении социальной помощи на приобретение топлива специалистам образования, социального обеспечения, культуры и спорта, проживающим в сельских населенных пунктах Аксуского региона
  kaz: Ақсу аймағының елді мекендерінде тұратын білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына отын сатып алуға әлеуметтік көмек тағайындау туралы
