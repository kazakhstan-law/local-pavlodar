requisite: Решение маслихата города Аксу Павлодарской области от 22 июля 2015 года № 356/47. Зарегистрировано Департаментом юстиции Павлодарской области 21 августа 2015 года № 4671. Утратило силу решением маслихата города Аксу Павлодарской области от 15 мая 2019 года № 312/42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставок земельного налога и единого земельного налога в десять раз на неиспользуемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения  города Аксу
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы Ақсу қаласының  жерлеріне жер салығының және  бірыңғай жер салығының мөлшерлемелерін он есе жоғарылату туралы
