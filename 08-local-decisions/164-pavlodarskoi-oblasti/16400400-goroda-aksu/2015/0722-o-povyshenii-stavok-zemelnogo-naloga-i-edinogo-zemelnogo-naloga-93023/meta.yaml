  title:
    rus: О внесении изменения в решение Аксуского городского маслихата от 22 июля 2015 года № 356/47 «О повышении ставок земельного налога и единого земельного налога в десять раз на неиспользуемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения  города Аксу»
    kaz: Ақсу қалалық мәслихатының 2015 жылғы  22 шілдедегі «Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы Ақсу қаласының  жерлеріне жер салығының және бірыңғай жер салығының мөлшерлемелерін он  есе жоғарылату туралы» № 356/47 шешіміне өзгеріс енгізу туралы
