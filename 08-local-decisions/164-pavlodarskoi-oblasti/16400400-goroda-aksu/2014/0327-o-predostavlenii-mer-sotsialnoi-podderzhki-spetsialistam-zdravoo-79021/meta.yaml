requisite: Решение маслихата города Аксу Павлодарской области от 27 марта 2014 года № 201/29. Зарегистрировано Департаментом юстиции Павлодарской области 21 апреля 2014 года № 3764
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Аксу в 2014 году
  kaz: 2014 жылы Ақсу қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын ұсыну туралы
