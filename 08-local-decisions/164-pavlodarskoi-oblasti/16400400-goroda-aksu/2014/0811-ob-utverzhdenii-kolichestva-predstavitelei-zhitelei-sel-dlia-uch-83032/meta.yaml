act_code: '83032'
requisite: Решение маслихата города Аксу Павлодарской области от 11 августа 2014 года № 251/36. Зарегистрировано Департаментом юстиции Павлодарской области 09 сентября 2014 года № 3997. Утратило силу решением Аксуского городского маслихата Павлодарской области от 1 июня 2022 года № 170/23 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении количества представителей жителей сел для участия в сходе местного сообщества и правил проведения раздельных сходов местного сообщества на территории Калкаманского сельского округа города Аксу
  kaz: Ақсу қаласы Қалқаман селолық округі аумағында жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын және бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын бекіту туралы
