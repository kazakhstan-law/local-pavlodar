  title:
    rus: О внесении изменения в решение акима города Аксу от 04 февраля 2014 года № 1 «Об образовании избирательных участков на территории города Аксу по проведению выборов Президента Республики Казахстан, депутатов Мажилиса Парламента и маслихатов, членов иных органов местного самоуправления»
    kaz: Ақсу қаласы әкімінің 2014 жылғы 04 ақпандағы «Ақсу қаласының аумағында Қазақстан Республикасы Президентінің, Парламент Мәжілісі және мәслихаттары депутаттарының, жергілікті өзін-өзі басқарудың өзге де органдары мүшелерінің сайлауларын өткізу бойынша сайлау учаскелерін құру туралы» № 1 шешіміне өзгеріс енгізу туралы
