act_code: '119308'
requisite: Решение маслихата города Аксу Павлодарской области от 27 февраля 2018 года № 178/22. Зарегистрировано Департаментом юстиции Павлодарской области 6 марта 2018 года № 5893
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Аксу в 2018 году
  kaz: 2018 жылы Ақсу қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
