act_code: '136028'
requisite: Решение маслихата города Аксу Павлодарской области от 6 ноября 2019 года № 362/50. Зарегистрировано Департаментом юстиции Павлодарской области 15 ноября 2019 года № 6607
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Аксу
  kaz: Ақсу қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің Қағидалары мен мөлшерін бекіту туралы
