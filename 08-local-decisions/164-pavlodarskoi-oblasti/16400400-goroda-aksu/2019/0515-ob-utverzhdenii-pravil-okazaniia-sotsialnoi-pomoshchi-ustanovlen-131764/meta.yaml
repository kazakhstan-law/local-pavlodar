  title:
    rus: О внесении изменений и дополнения в решение Аксуского городского маслихата от 15 мая 2019 года № 313/42 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Аксу»
    kaz: Ақсу қалалық мәслихатының 2019 жылғы 15 мамырдағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ақсу қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 313/42 шешіміне өзгерістер мен толықтыру енгізу туралы
