  title:
    rus: О внесении изменения в решение Аксуского городского маслихата от 10 января 2019 года № 290/38 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Аксу в 2019 году»
    kaz: Ақсу қалалық мәслихатының 2019 жылғы 10 қаңтардағы «2019 жылы Ақсу қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 290/38 шешіміне өзгеріс енгізу туралы
