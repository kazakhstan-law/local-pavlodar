requisite: Решение маслихата города Аксу Павлодарской области от 10 января 2019 года № 290/38. Зарегистрировано Департаментом юстиции Павлодарской области 15 января 2019 года № 6233
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Аксу в 2019 году
  kaz: 2019 жылы Ақсу қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
