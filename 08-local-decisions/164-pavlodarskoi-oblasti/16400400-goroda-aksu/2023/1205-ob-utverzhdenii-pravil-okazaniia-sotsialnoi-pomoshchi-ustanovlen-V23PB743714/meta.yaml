  title:
    rus: О внесении изменений и дополнений в решение Аксуского городского маслихата от 5 декабря 2023 года № 71/10 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Аксу»
    kaz: Ақсу қалалық мәслихатының 2023 жылғы 5 желтоқсандағы № 71/10 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ақсу қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
