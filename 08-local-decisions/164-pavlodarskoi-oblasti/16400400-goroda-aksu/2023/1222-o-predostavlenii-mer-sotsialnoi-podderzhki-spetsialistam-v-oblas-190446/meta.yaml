  title:
    rus: О внесении изменения в решение Аксуского городского маслихата от 22 декабря 2023 года № 89/12 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Аксу в 2024 году»
    kaz: Ақсу қалалық мәслихатының 2023 жылғы 22 желтоқсандағы «2024 жылы Ақсу қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы» № 89/12 шешіміне өзгеріс енгізу туралы
