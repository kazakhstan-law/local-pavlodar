act_code: '115619'
requisite: Решение исполняющего обязанности акима Достыкского сельского округа города Аксу Павлодарской области от 11 октября 2017 года № 1-03/01. Зарегистрировано Департаментом юстиции Павлодарской области 30 октября 2017 года № 5655. Утратило силу решением акима Достыкского сельского округа города Аксу Павлодарской области от 9 апреля 2019 года № 1-03/06 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории села Береке Достыкского сельского округа города Аксу
  kaz: Ақсу қаласы Достық селолық округінің Береке ауылының аумағында шектеу іс-шараларын белгілеу туралы
