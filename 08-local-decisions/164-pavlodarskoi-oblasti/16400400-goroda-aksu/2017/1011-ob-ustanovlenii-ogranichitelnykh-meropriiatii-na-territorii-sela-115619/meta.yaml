  requisite: Решение акима Достыкского сельского округа города Аксу Павлодарской области от 10 сентября 2018 года № 1-03/05. Зарегистрировано Департаментом юстиции Павлодарской области 11 сентября 2018 года № 6058
  title:
    rus: О снятии ограничительных мероприятий на территории села Пограничник Достыкского сельского округа и внесении изменений в решение исполняющего обязанности акима Достыкского сельского округа города Аксу от 11 октября 2017 года № 1-03/01 «Об установлении ограничительных мероприятий на территории сел Береке и Пограничник Достыкского сельского округа города Аксу»
    kaz: Достық селолық округі Пограничник ауылының аумағында шектеу іс-шараларын тоқтату және Ақсу қаласы Достық селолық округі әкімінің міндетін атқарушының 2017 жылғы 11 қазандағы «Ақсу қаласы Достық селолық округінің Береке және Пограничник ауылдарының аумағында шектеу іс-шараларын белгілеу туралы» № 1-03/01 шешіміне өзгерістер енгізу туралы
