  title:
    rus: О внесении изменений в решение городского маслихата от 31 марта 2009 года № 114/15 "Об утверждении Правил оказания жилищной помощи малообеспеченным гражданам по оплате содержания жилища, потребления коммунальных услуг, услуг связи и компенсации затрат на отдельные виды капитального ремонта общего имущества объекта кондоминиума по городу Аксу"
    kaz: Қалалық мәслихаттың 2009 жылғы 31 наурыздағы "Ақсу қаласы бойынша аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсетулерді, байланыс қызмет көрсетулерін тұтынуға және кондоминиум объектісінің ортақ мүлігін күрделі жөндеудің жекелеген түрлеріне шығын өтемақысын төлеу бойынша тұрғын үй көмегінің Қағидасын бекіту туралы" № 114/15 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/51366/rus
