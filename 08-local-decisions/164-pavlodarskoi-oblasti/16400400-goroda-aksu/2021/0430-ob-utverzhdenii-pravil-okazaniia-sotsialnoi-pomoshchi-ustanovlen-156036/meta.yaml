  title:
    rus: О внесении изменений в решение Аксуского городского маслихата от 30 апреля 2021 года № 40/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Аксу»
