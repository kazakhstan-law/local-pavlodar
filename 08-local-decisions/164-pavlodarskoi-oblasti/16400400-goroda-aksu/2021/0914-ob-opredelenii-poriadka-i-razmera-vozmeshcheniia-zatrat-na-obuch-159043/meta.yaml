  title:
    rus: О внесении изменений в решение Аксуского городского маслихата от 14 сентября 2021 года № 69/9 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Аксу»
    kaz: Ақсу қалалық мәслихатының 2021 жылғы 14 қыркүйектегі «Ақсу қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» № 69/9 шешіміне өзгерістер енгізу туралы
