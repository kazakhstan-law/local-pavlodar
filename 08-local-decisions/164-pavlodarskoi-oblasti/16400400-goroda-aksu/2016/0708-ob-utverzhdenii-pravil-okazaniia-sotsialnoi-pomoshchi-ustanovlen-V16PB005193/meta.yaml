  title:
    rus: О внесении изменений в решение Аксуского городского маслихата от 8 июля 2016 года № 38/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Аксу»
