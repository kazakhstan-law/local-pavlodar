  title:
    rus: О внесении изменений и дополнений в решение Аксуского городского маслихата от 8 июля 2016 года № 38/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Аксу»
    kaz: Ақсу қалалық мәслихатының 2016 жылғы 8 шілдедегі  «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ақсу қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айкындаудың қағидаларын бекіту туралы» № 38/5 шешіміне өзгерістер  және толықтырулар енгізу туралы
