requisite: Решение маслихата района Тереңкөл Павлодарской области от 10 марта 2020 года № 1/54. Зарегистрировано Департаментом юстиции Павлодарской области 16 марта 2020 года № 6749. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 7 августа 2020 года № 3/59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
