requisite: Решение маслихата района Тереңкөл Павлодарской области от 10 марта 2020 года № 8/54. Зарегистрировано Департаментом юстиции Павлодарской области 16 марта 2020 года № 6748. Утратило силу решением маслихата района Тереңкөл от 10 октября 2023 года № 3/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Калиновского сельского округа района Тереңкөл
  kaz: Тереңкөл ауданы Калиновка ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы
