requisite: Решение маслихата Качирского района Павлодарской области от 26 сентября 2014 года № 9/33. Зарегистрировано Департаментом юстиции Павлодарской области 08 октября 2014 года № 4082. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 31 октября 2019 года № 5/49 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
