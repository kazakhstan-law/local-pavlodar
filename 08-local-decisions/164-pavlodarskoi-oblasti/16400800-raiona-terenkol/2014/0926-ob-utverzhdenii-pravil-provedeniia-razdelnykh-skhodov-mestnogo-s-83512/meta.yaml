requisite: Решение маслихата Качирского района Павлодарской области от 26 сентября 2014 года № 13/33. Зарегистрировано Департаментом юстиции Павлодарской области 08 октября 2014 года № 4077. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 10 марта 2020 года № 3/54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Воскресенского сельского округа Качирского района
  kaz: Качир ауданы Воскресенка ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын бекіту туралы
