act_code: '83536'
requisite: Решение маслихата Качирского района Павлодарской области от 26 сентября 2014 года № 4/33. Зарегистрировано Департаментом юстиции Павлодарской области 08 октября 2014 года № 4089. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 30 декабря 2019 года № 3/53 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Качирского района
  kaz: Качир ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, білім, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек ұсыну туралы
