requisite: Решение маслихата Качирского района Павлодарской области от 18 июля 2012 года № 5/6. Зарегистрировано Департаментом юстиции Павлодарской области 08 августа 2012 года № 12-8-132. Утратило силу решением маслихата Качирского района Павлодарской области от 26 сентября 2014 года № 20/33
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Качирского раона
  kaz: Качир ауданы ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек ұсыну туралы
