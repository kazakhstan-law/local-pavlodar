  title:
    rus: О внесении изменения и дополнения в решение маслихата района Тереңкөл от 6 декабря 2023 года № 3/10 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Тереңкөл»
    kaz: Тереңкөл аудандық мәслихатының 2023 жылғы 6 желтоқсандағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Тереңкөл ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 3/10 шешіміне өзгеріс пен толықтыру енгізу туралы
