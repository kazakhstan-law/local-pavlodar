  title:
    rus: О внесении изменения в решение маслихата района Тереңкөл от 6 декабря 2023 года № 2/10 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Тереңкөл на 2024 год»
    kaz: Тереңкөл аудандық мәслихатының «Тереңкөл аудандық мәслихатының 2023 жылғы 6 желтоқсандағы «2024 жылға арналған Тереңкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы» № 2/10 шешіміне өзгеріс енгізу туралы
