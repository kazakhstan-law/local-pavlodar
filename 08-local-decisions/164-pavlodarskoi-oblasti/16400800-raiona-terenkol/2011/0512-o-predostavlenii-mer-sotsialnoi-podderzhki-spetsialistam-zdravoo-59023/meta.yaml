act_code: '59023'
requisite: Решение маслихата Качирского района Павлодарской области от 12 мая 2011 года № 2/31. Зарегистрировано Департаментом юстиции Павлодарской области 25 мая 2011 года № 12-8-111. Утратило силу решением маслихата Качирского района Павлодарской области от 17 июня 2013 года № 8/14
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Качирского района в 2011 году
  kaz: 2011 жылы Качир ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
