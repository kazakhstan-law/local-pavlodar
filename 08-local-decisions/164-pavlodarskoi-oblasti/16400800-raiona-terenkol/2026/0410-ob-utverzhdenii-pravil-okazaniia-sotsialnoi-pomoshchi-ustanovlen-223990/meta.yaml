act_code: '223990'
requisite: Решение маслихата района Тереңкөл Павлодарской области от 10 апреля 2026 года № 1/43
title:
  rus: Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Тереңкөл Павлодарской области
  kaz: Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Павлодар облысы Тереңкөл ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
