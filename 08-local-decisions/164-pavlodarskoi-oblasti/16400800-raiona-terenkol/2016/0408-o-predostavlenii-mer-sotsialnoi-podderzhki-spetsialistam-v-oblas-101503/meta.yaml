act_code: '101503'
requisite: Решение маслихата Качирского района Павлодарской области от 8 апреля 2016 года № 2/2. Зарегистрировано Департаментом юстиции Павлодарской области 20 апреля 2016 года № 5090. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 28 декабря 2018 года № 2/40 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Качирского района
  kaz: Качир ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
