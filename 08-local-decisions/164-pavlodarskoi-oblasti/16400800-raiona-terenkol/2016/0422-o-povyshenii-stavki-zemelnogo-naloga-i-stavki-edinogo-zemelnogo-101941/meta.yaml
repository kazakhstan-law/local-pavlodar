requisite: Решение маслихата Качирского района Павлодарской области от 22 апреля 2016 года № 2/3. Зарегистрировано Департаментом юстиции Павлодарской области 05 мая 2016 года № 5106. Утратило силу решением маслихата Качирского района Павлодарской области от 07 июля 2016 года N 3/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставки земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Качирского района Павлодарской области
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Качир ауданының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
