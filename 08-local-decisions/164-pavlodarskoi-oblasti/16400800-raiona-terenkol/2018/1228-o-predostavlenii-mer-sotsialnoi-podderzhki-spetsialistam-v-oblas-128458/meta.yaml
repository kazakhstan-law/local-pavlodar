act_code: '128458'
requisite: Решение маслихата района Тереңкөл Павлодарской области от 28 декабря 2018 года № 2/40. Зарегистрировано Департаментом юстиции Павлодарской области 9 января 2019 года № 6228
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Тереңкөл на 2019 год
  kaz: 2019 жылға арналған Тереңкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы
