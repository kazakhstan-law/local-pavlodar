  title:
    rus: О внесении изменения в решение маслихата района Тереңкөл от 28 декабря 2018 года № 2/40 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Тереңкөл на 2019 год»
    kaz: Тереңкөл аудандық мәслихатының 2018 жылғы 28 желтоқсандағы «2019 жылға арналған Тереңкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы» № 2/40 шешіміне өзгеріс енгізу туралы
