requisite: Решение маслихата района Тереңкөл Павлодарской области от 13 июня 2019 года № 5/45. Зарегистрировано Департаментом юстиции Павлодарской области 21 июня 2019 года № 6440. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 7 августа 2020 года № 2/59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения административным государственным служащим государственного учреждения Аппарат маслихата района Тереңкөл и его описание
