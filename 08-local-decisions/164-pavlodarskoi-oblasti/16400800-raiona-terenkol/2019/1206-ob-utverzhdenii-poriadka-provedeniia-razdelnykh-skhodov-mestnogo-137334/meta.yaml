requisite: Решение маслихата района Тереңкөл Павлодарской области от 6 декабря 2019 года № 2/51. Зарегистрировано Департаментом юстиции Павлодарской области 24 декабря 2019 года № 6670. Утратило силу решением маслихата района Тереңкөл от 10 октября 2023 года № 3/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Жанакурлысского сельского округа района Тереңкөл
  kaz: Тереңкөл ауданы Жаңақұрылыс ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы
