act_code: '136966'
requisite: Решение маслихата района Тереңкөл Павлодарской области от 6 декабря 2019 года № 3/51. Зарегистрировано Департаментом юстиции Павлодарской области 12 декабря 2019 года № 6664. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 3 ноября 2020 года № 1/63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Тереңкөл на 2020 год
  kaz: 2020 жылға арналған Тереңкөл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы
