requisite: Решение маслихата района Тереңкөл Павлодарской области от 6 декабря 2019 года № 4/51. Зарегистрировано Департаментом юстиции Павлодарской области 31 декабря 2019 года № 6696. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 30 апреля 2021 года № 5/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
