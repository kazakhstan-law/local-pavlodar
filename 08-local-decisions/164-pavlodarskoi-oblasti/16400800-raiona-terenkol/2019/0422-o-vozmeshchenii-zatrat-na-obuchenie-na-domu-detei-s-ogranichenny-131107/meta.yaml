requisite: Решение маслихата района Тереңкөл Павлодарской области от 22 апреля 2019 года № 7/43. Зарегистрировано Департаментом юстиции Павлодарской области 26 апреля 2019 года № 6320. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 5 ноября 2021 года № 5/11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О возмещении затрат на обучение на дому детей с ограниченными возможностями  из числа инвалидов по индивидуальному учебному плану в районе Тереңкөл
