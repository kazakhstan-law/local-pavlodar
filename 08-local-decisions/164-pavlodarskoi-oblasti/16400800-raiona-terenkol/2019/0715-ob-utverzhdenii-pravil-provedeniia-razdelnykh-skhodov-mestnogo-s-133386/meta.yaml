requisite: Решение маслихата района Тереңкөл Павлодарской области от 15 июля 2019 года № 2/47. Зарегистрировано Департаментом юстиции Павлодарской области 18 июля 2019 года № 6483. Утратило силу решением маслихата района Тереңкөл от 10 октября 2023 года № 3/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
