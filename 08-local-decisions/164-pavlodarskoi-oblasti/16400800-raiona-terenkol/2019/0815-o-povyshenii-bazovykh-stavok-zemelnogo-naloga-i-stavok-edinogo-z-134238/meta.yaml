requisite: Решение маслихата района Тереңкөл Павлодарской области от 15 августа 2019 года № 3/48. Зарегистрировано Департаментом юстиции Павлодарской области 23 августа 2019 года № 6511. Утратило силу решением маслихата района Тереңкөл Павлодарской области от 18 августа 2022 года № 3/24 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения района Тереңкөл Павлодарской области
  kaz: Павлодар облысының Тереңкөл ауданы Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін арттыру туралы
