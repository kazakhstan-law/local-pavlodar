  title:
    rus: О внесении изменений в решение Качирского районного маслихата от 21 декабря 2017 года № 2/22 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Качирского района на 2018 год»
    kaz: Качир аудандық мәслихатының 2017 жылғы 21 желтоқсандағы «2018 жылға арналған Качир ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 2/22 шешіміне өзгерістер енгізу туралы
