act_code: '117801'
requisite: Решение маслихата Качирского района Павлодарской области от 21 декабря 2017 года № 2/22. Зарегистрировано Департаментом юстиции Павлодарской области 12 января 2018 года № 5818
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Тереңкөл на 2018 год
  kaz: 2018 жылға арналған Тереңкөл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
