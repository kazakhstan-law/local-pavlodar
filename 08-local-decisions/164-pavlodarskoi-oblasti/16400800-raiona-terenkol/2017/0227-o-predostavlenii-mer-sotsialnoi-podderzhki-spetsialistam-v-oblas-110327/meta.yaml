act_code: '110327'
requisite: Решение маслихата Качирского района Павлодарской области от 27 февраля 2017 года № 1/12. Зарегистрировано Департаментом юстиции Павлодарской области 14 марта 2017 года № 5403
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Качирского района на 2017 год
  kaz: 2017 жылға арналған Качир ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
