  title:
    rus: О внесении изменений в решение маслихата района Тереңкөл от 5 ноября 2021 года № 5/11 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в районе Тереңкөл»
    kaz: Тереңкөл аудандық мәслихатының 2021 жылғы 5 қарашадағы № 5/11 «Тереңкөл ауданында мүгедектер қатарындағы кемтар балаларды  жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
