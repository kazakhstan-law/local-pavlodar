requisite: Решение маслихата района Тереңкөл Павлодарской области от 5 ноября 2021 года № 5/11. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 ноября 2021 года № 25192
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в районе Тереңкөл
  kaz: Тереңкөл ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
