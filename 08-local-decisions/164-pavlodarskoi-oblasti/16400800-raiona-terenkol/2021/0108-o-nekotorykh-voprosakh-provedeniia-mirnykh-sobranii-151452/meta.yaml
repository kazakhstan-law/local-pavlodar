  requisite: Решение маслихата района Тереңкөл Павлодарской области от 7 сентября 2021 года № 5/9. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 сентября 2021 года № 24407
  title:
    rus: О внесении изменений в решение маслихата района Тереңкөл от 8 января 2021 года № 1/68 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, норм их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в районе Тереңкөл»
    kaz: Тереңкөл аудандық мәслихатының 2021 жылғы 8 қаңтардағы № 1/68 «Тереңкөл ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және  өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158703/rus
