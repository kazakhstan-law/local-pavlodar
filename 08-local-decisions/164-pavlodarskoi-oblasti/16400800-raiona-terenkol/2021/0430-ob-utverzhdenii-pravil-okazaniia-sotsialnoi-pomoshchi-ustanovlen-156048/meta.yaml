requisite: Решение маслихата района Тереңкөл Павлодарской области от 30 апреля 2021 года № 5/5. Зарегистрировано Департаментом юстиции Павлодарской области 21 мая 2021 года № 7289. Утратило силу решением маслихата района Тереңкөл от 6 декабря 2023 года № 3/10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
