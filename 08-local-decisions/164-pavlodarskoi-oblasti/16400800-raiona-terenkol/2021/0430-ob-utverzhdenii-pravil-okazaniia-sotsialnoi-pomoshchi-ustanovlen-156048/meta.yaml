  title:
    rus: О внесении изменений в решение маслихата района Тереңкөл от 30 апреля 2021 года № 5/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Тереңкөл»
    kaz: Тереңкөл аудандық мәслихатының 2021 жылғы 30 сәуірдегі № 5/5 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Тереңкөл ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
