  title:
    rus: О внесении изменения в решение маслихата района Аққулы от 25 декабря 2023 года № 56/13 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Аққулы в 2024 году»
    kaz: Аққулы аудандық мәслихатының 2023 жылғы 25 желтоқсандағы № 56/13 «2024 жылы Аққулы ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
