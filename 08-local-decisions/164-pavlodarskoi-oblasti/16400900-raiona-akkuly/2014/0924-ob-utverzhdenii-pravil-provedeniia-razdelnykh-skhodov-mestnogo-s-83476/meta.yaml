requisite: Решение маслихата Лебяжинского района Павлодарской области от 24 сентября 2014 года № 8/36. Зарегистрировано Департаментом юстиции Павлодарской области 3 октября 2014 года № 4046. Утратило силу решением маслихата района Аққулы Павлодарской области от 24 июля 2020 года № 265/55 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
