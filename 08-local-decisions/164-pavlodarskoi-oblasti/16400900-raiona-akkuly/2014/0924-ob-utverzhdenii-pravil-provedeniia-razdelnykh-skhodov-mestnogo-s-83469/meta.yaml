requisite: Решение маслихата Лебяжинского района Павлодарской области от 24 сентября 2014 года № 4/36. Зарегистрировано Департаментом юстиции Павлодарской области 03 октября 2014 года № 4043. Утратило силу решением маслихата района Аққулы Павлодарской области от 7 августа 2020 года № 275/56 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
