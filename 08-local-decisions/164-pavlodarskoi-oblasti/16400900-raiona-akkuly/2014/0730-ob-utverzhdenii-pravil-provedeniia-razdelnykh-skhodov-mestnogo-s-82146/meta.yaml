requisite: Решение маслихата Лебяжинского района Павлодарской области от 30 июля 2014 года № 2/34. Зарегистрировано Департаментом юстиции Павлодарской области 20 августа 2014 года № 3942. Утратило силу решением маслихата района Аққулы Павлодарской области от 20 октября 2020 года № 279/57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
