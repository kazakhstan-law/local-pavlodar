requisite: Решение маслихата Лебяжинского района Павлодарской области от 24 сентября 2014 года № 6/36. Зарегистрировано Департаментом юстиции Павлодарской области 3 октября 2014 года № 4045. Утратило силу решением маслихата района Аққулы Павлодарской области от 20 октября 2020 года № 280/57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
