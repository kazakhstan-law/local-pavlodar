requisite: Решение маслихата Лебяжинского района Павлодарской области от 24 сентября 2014 года № 7/36. Зарегистрировано Департаментом юстиции Павлодарской области 03 октября 2014 года № 4047. Утратило силу решением маслихата района Аққулы Павлодарской области от 24 июля 2020 года № 268/55 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Шарбактинского сельского округа Лебяжинского района
  kaz: Лебяжі ауданы Шарбақты ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын бекіту туралы
