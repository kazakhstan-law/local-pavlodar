    kaz: Лебяжі аудандық мәслихатының 2014 жылғы  5 наурыздағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің  және Лебяжі ауданындағы мұқтаж  азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 1/27 шешіміне өзгеріс енгізу туралы
