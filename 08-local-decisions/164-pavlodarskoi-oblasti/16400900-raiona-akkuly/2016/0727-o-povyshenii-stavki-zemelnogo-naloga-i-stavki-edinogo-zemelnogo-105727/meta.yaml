act_code: '105727'
requisite: Решение маслихата Лебяжинского района Павлодарской области от 27 июля 2016 года № 24/6. Зарегистрировано Департаментом юстиции Павлодарской области 26 августа 2016 года № 5223. Утратило силу решением маслихата района Аққулы Павлодарской области от 19 июня 2019 года № 207/42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставки земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Лебяжинского района Павлодарской области
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Лебяжі ауданының ауыл шаруашылығы мақсатындағы пайдаланылмайтын жерлердің жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
