act_code: '108951'
requisite: Решение маслихата Лебяжинского района Павлодарской области от 22 декабря 2016 года № 59/11. Зарегистрировано Департаментом юстиции Павлодарской области 9 января 2017 года № 5332
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Лебяжинского района в 2017 году
  kaz: 2017 жылы Лебяжі ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын ұсыну мөлшері туралы
