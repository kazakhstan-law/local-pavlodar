act_code: '101460'
requisite: Решение маслихата Лебяжинского района Павлодарской области от 12 апреля 2016 года № 10/3. Зарегистрировано Департаментом юстиции Павлодарской области 20 апреля 2016 года № 5088. Утратило силу решением маслихата района Аққулы Павлодарской области от 18 марта 2020 года № 253/52 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Лебяжинского района
  kaz: Лебяжі ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
