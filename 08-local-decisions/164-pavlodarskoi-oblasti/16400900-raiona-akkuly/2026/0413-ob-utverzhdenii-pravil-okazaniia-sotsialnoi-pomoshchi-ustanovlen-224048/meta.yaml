  title:
    rus: О внесении изменений в решение маслихата района Аққулы от 13 апреля 2026 года № 186/46 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Аққулы»
    kaz: Аққулы аудандық мәслихатының 2026 жылғы 13 сәуірдегі № 186/46 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Аққулы ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
