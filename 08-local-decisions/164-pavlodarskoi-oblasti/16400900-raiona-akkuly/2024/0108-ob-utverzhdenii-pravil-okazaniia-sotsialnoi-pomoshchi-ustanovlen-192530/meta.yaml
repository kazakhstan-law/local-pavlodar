  title:
    rus: О внесении изменений в решение маслихата района Аққулы от 8 января 2024 года № 65/16 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Аққулы»
