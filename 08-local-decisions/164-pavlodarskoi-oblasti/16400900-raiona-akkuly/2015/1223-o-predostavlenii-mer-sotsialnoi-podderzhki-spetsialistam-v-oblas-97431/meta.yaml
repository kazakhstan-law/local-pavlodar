requisite: Решение маслихата Лебяжинского района Павлодарской области от 23 декабря 2015 № 2/48. Зарегистрировано Департаментом юстиции Павлодарской области 13 января 2016 года N 4886
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Лебяжинского района в 2016 году
  kaz: 2016 жылы Лебяжі ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын ұсыну мөлшері туралы
