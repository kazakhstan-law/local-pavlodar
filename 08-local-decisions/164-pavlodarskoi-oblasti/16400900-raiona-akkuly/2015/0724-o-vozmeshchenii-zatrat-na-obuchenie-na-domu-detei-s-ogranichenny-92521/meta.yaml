requisite: Решение маслихата Лебяжинского района Павлодарской области от 24 июля 2015 года № 2/44. Зарегистрировано Департаментом юстиции Павлодарской области 04 августа 2015 года № 4642. Утратило силу решением маслихата района Аққулы Павлодарской области от 18 марта 2020 года № 254/52 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О возмещении затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Лебяжинском районе
  kaz: «Лебяжі ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу туралы»
