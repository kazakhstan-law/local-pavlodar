    kaz: Аудандық мәслихаттың 2015 жылғы 24 шілдедегі «Лебяжі ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу туралы» № 2/44 шешіміне өзгерістер енгізу туралы
