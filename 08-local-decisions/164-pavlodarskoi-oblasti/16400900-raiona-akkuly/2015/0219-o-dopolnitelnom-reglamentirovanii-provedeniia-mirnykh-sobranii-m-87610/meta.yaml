requisite: Решение маслихата Лебяжинского района Павлодарской области от 19 февраля 2015 года № 3/41. Зарегистрировано Департаментом юстиции Павлодарской области 17 марта 2015 года № 4367.  Утратило силу решением маслихата Лебяжинского района Павлодарской области от 2 марта 2016 года N 1/52 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном регламентировании проведения мирных собраний, митингов, шествий, пикетов и демонстраций на территории населенных пунктов Лебяжинского района
  kaz: Лебяжі ауданы елді мекендер аумағында бейбіт жиналыстарды, митингілерді, шерулерді, пикеттерді және демонстрацияларды өткізуге қосымша регламенттеу туралы
