  title:
    rus: О внесении дополнения в решение Лебяжинского районного  маслихата от 10 апреля 2015 года № 4/42 «Об утверждении Правил оказания социальной помощи, установления  размеров и определения перечня отдельных категорий нуждающихся граждан Лебяжинского района»
    kaz: Лебяжі аудандық мәслихаттың 2015 жылғы 10 сәуірдегі «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және Лебяжі ауданындағы мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың Қағидаларын бекіту туралы» № 4/42 шешіміне толықтыру енгізу туралы
