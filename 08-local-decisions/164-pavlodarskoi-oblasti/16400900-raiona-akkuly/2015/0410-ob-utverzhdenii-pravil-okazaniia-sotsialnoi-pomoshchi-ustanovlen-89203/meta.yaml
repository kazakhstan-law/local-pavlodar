requisite: Решение маслихата Лебяжинского района Павлодарской области от 10 апреля 2015 года № 4/42. Зарегистрировано Департаментом юстиции Павлодарской области 30 апреля 2015 года № 4452. Утратило силу решением маслихата района Аққулы Павлодарской области от 19 июня 2019 года № 206/42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
