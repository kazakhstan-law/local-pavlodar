requisite: Решение акима Малыбайского сельского округа района Аққулы Павлодарской области от 1 июня 2021 года № 1-04/2. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2021 года № 22948. Утратило силу решением акима Малыбайского сельского округа района Аққулы Павлодарской области от 31 августа 2021 года № 1-04/6 (вводится в действие со дня первого официального опубликования)
title:
