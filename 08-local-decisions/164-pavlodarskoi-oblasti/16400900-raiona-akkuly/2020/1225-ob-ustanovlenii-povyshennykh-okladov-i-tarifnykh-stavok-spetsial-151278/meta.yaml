act_code: '151278'
requisite: Решение маслихата района Аққулы Павлодарской области от 25 декабря 2020 года № 296/61. Зарегистрировано Департаментом юстиции Павлодарской области 5 января 2021 года № 7149
title:
  rus: Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими  и работающим в сельских населенных пунктах района Аққулы, а также указанным специалистам, работающим в государственных организациях, финансируемых из местного бюджета
  kaz: Азаматтық қызметшілер болып табылатын және Аққулы ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға,  сондай-ақ жергілікті бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
