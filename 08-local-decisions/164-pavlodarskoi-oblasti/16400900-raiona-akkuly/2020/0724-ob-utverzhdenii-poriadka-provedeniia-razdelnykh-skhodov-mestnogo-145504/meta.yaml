  title:
    rus: О внесении изменений в решение маслихата района Аққулы от 24 июля 2020 года № 263/55 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Баймульдинского сельского округа района Аққулы»
    kaz: Аққулы аудандық мәслихатының 2020 жылғы 24 шілдедегі «Аққулы ауданы Баймолдин ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы» № 263/55 шешіміне өзгерістер енгізу туралы
