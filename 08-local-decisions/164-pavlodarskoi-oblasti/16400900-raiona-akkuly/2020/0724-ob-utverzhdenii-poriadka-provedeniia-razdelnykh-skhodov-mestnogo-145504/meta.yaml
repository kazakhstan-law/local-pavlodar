act_code: '145504'
requisite: Решение маслихата района Аққулы Павлодарской области от 24 июля 2020 года № 263/55. Зарегистрировано Департаментом юстиции Павлодарской области 14 августа 2020 года № 6894. Утратило силу решением маслихата района Аққулы Павлодарской области от 16 ноября 2023 года № 51/11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Баймульдинского сельского округа района Аққулы
  kaz: Аққулы ауданы Баймолдин ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы
