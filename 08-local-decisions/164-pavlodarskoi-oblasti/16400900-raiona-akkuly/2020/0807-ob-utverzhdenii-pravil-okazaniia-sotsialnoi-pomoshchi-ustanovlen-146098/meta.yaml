  title:
    rus: О внесении изменения в решение маслихата района Аққулы от 7 августа 2020 года № 274/56 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Аққулы»
    kaz: Аққулы аудандық мәслихаттың 2020 жылғы 7 тамыздағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Аққулы ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 274/56 шешіміне өзгеріс енгізу туралы
