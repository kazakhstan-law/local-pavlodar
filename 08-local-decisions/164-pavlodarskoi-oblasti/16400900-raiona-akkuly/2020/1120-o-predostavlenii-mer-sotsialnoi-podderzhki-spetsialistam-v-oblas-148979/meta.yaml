act_code: '148979'
requisite: Решение маслихата района Аққулы Павлодарской области от 20 ноября 2020 года № 285/58. Зарегистрировано Департаментом юстиции Павлодарской области 26 ноября 2020 года № 7044
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Аққулы в 2020 году
  kaz: 2020 жылы Аққулы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
