requisite: Решение маслихата района Аққулы Павлодарской области от 24 июля 2020 года № 268/55. Зарегистрировано Департаментом юстиции Павлодарской области 20 августа 2020 года № 6914. Утратило силу решением маслихата района Аққулы Павлодарской области от 16 ноября 2023 года № 51/11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
