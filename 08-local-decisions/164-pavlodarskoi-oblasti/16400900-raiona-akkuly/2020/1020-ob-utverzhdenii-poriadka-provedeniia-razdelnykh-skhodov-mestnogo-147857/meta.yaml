title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села для участия в сходе местного сообщества на территории сельского округа Аққулы района Аққулы
  kaz: Аққулы ауданы Аққулы ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындау туралы
