  title:
    rus: О внесении изменений в решение маслихата района Аққулы от 20 октября 2020 года № 279/57 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села для участия в сходе местного сообщества на территории сельского округа Аққулы района Аққулы»
    kaz: Аққулы аудандық мәслихатының 2020 жылғы 20 қазандағы «Аққулы ауданы Аққулы ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындау туралы» № 279/57 шешіміне өзгерістер енгізу туралы
