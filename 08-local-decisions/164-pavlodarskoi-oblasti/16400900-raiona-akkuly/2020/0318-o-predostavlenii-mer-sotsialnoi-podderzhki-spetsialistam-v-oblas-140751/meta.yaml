act_code: '140751'
requisite: Решение маслихата района Аққулы Павлодарской области от 18 марта 2020 года № 252/52. Зарегистрировано Департаментом юстиции Павлодарской области 30 марта 2020 года № 6775. Утратило силу решением маслихата района Аққулы Павлодарской области от 20 ноября 2020 года № 285/58 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Аққулы в 2020 году
  kaz: 2020 жылы Аққулы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
