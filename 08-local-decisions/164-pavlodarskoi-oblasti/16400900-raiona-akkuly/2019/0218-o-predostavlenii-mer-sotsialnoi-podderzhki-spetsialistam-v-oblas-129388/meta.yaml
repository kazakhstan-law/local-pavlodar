requisite: Решение маслихата района Аққулы Павлодарской области от 18 февраля 2019 года № 192/38. Зарегистрировано Департаментом юстиции Павлодарской области 28 февраля 2019 года № 6260
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Аққулы в 2019 году
  kaz: 2019 жылға арналған Аққулы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешені саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы
