  title:
    rus: О внесении изменения в решение маслихата района Аққулы от 18 февраля 2019 года № 192/38 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Аққулы в 2019 году»
    kaz: Аққулы аудандық мәслихатының 2019 жылғы 18 ақпандағы «2019 жылға арналған Аққулы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешені саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы» № 192/38 шешіміне өзгеріс енгізу туралы
