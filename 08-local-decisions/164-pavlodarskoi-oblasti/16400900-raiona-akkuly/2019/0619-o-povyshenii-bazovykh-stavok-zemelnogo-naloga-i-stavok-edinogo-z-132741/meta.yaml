requisite: Решение маслихата района Аққулы Павлодарской области от 19 июня 2019 года № 207/42. Зарегистрировано Департаментом юстиции Павлодарской области 21 июня 2019 года № 6434. Утратило силу решением маслихата района Аққулы Павлодарской области от 21 сентября 2022 года № 98/20 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении  базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения района Аққулы
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Аққулы ауданының ауыл шаруашылығы мақсатындағы пайдаланылмайтын жерлердің жер салығының  базалық мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
