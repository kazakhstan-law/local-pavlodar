requisite: Решение маслихата района Аққулы Павлодарской области от 19 июня 2019 года № 206/42. Зарегистрировано Департаментом юстиции Павлодарской области 24 июня 2019 года № 6442. Утратило силу решением маслихата района Аққулы Павлодарской области от 7 августа 2020 года № 274/56 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
