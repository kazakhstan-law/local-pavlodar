act_code: '117495'
requisite: Решение маслихата Лебяжинского района Павлодарской области от 25 декабря 2017 года № 124/20. Зарегистрировано Департаментом юстиции Павлодарской области 5 января 2018 года № 5779
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Лебяжинского района в 2018 году
  kaz: 2018 жылға арналған Лебяжі ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
