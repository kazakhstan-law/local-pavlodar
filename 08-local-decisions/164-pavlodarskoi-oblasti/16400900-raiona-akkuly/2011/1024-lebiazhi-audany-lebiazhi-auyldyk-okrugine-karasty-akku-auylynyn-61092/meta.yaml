act_code: '61092'
requisite: Павлодар облысы Лебяжі ауданы Лебяжі ауылдық округ әкім міндетің атқарушысының 2011 жылғы 24 қазандағы № 03 шешімі. Павлодар облысы Лебяжі аудандық Әділет басқармасында 2011 жылғы 03 қарашада № 12-9-143 тіркелді
