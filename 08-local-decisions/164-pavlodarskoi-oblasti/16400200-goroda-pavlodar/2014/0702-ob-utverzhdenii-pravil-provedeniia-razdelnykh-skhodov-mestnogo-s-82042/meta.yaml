  title:
    rus: О внесении изменений в решение Павлодарского городского маслихата от 02 июля 2014 года № 282/39 «Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей села для участия в сходе местного сообщества на территории села Павлодарское города Павлодара»
    kaz: Павлодар қалалық мәслихатының «Павлодар қаласы Павлодар ауылының аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерің санын бекіту туралы» 2014 жылғы 02 шілдедегі № 282/39 шешіміне өзгерістер енгізу туралы
