    kaz: Павлодар қалалық мәслихатының «Павлодар қаласы Жетекші ауылының аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын бекіту туралы» 2014 жылғы 02 шілдедегі № 284/39 шешіміне өзгерістер енгізу туралы
