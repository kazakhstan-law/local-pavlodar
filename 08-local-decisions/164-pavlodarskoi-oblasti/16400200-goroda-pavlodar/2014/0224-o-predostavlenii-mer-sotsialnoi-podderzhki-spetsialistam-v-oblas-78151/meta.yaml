act_code: '78151'
requisite: Решение маслихата города Павлодара Павлодарской области от 24 февраля 2014 года № 234/32. Зарегистрировано Департаментом юстиции Павлодарской области 19 марта 2014 года № 3735
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2014 год
  kaz: 2014 жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
