  title:
    rus: О внесении изменений в решение Павлодарского городского маслихата от 24 февраля 2014 года № 234/32 "О предоставлении мер социальной поддержки специалистов в области здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2014 год"
    kaz: Павлодар қалалық мәслихатының 2014 жылғы 24 ақпандағы "2014 жылы Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы" № 234/32 шешіміне өзгерістер енгізу туралы
