act_code: '85606'
requisite: Решение маслихата города Павлодара Павлодарской области от 24 декабря 2014 года № 353/48. Зарегистрировано Департаментом юстиции Павлодарской области 05 января 2015 года № 4248
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2015 год
  kaz: 2015  жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
