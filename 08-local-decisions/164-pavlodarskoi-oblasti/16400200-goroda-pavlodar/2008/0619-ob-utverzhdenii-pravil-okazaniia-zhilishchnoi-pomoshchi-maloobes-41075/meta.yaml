  requisite: Решение маслихата города Павлодара Павлодарской области от 23 декабря 2008 года № 214/11. Зарегистрировано Управлением юстиции города Павлодара Павлодарской области 27 января 2009 года за № 12-1-131. Утратило силу решением маслихата города Павлодара Павлодарской области от 31 марта 2010 года № 26/23
  title:
    rus: О внесении изменений и дополнения в решение Павлодарского городского маслихата от 19 июня 2008 года № 148/7 "Об утверждении "Правил оказания жилищной помощи малообеспеченным гражданам по оплате содержания жилища, потребления коммунальных услуг, услуг связи и компенсации затрат на отдельные виды капитального ремонта общего имущества объекта кондоминиума из бюджета города"
    kaz: Павлодар қалалық мәслихатының 2008 жылғы 19 маусымдағы "Қалалық бюджеттен тұрғын үйді ұстау, коммуналдық қызметті, байланыс қызметін тұтыну төлемақысы және кондоминиум объектісінің ортақ мүлкін күрделі жөндеудің жекелеген түрлеріне жұмсалатын шығындар өтемақысы бойынша аз қамтамасыз етілген азаматтарға тұрғын үй көмегін көрсету қағидасын" бекіту туралы" № 148/7 шешіміне өзгерістер мен толықтыру енгізу туралы
