  requisite: Решение Павлодарского городского Маслихата от 18 августа 2004 года № 72/8. Зарегистрировано Департаментом юстиции Павлодарской области 10 сентября 2004 года за № 2710. Утратило силу - решением маслихата города Павлодара Павлодарской области от 19 июня 2008 года № 148/7
  title:
    rus: О внесении изменений и дополнений в решение Павлодарского городского маслихата от 4 июля 2003 года № 62/32 "Об утверждении "Правил оказания жилищных субсидий малообеспеченным гражданам по оплате содержания жилища и потребления коммунальных услуг из бюджета города Павлодара", зарегистрировано в департаменте юстиции 15 августа 2003 года за № 1999
    kaz: Павлодар қалалық мәслихатының 2003 жылғы 4 шілдедегі "Павлодар қаласы бюджетінен аз қамтамасыз етілген азаматтарға тұрғын үйді ұстау және коммуналдық қызметті тұтыну төлемақысы бойынша тұрғын үй жәрдемақысын көрсету жөніндегі қағиданы" бекіту туралы" № 62/32 өзгерістер мен толықтырулар енгізу туралы Павлодар облыстық әділет департаментінде 2003 жылғы 15 тамызда № 1999 тіркелген
