requisite: Решение Павлодарского городского Маслихата от 4 июля 2003 года № 62/32. Зарегистрировано Управлением юстиции Павлодарской области 15 августа 2003 года за № 1999. Утратило силу решением маслихата города Павлодара Павлодарской области от 19 июня 2008 года № 148/7
title:
  rus: Об утверждении "Правил оказания жилищной помощи малообеспеченным гражданам по оплате содержания жилища и потребления коммунальных услуг из бюджета города Павлодара"
  kaz: '"Павлодар қаласы бюджетiнен аз қамтамасыз етiлген азаматтарға тұрғын үйдi ұстау және коммуналдық қызметтi тұтыну төлемақысы бойынша тұрғын үй көмегі көрсету жөнiндегi қағиданы" бекiту туралы'
