act_code: '218912'
requisite: Решение Павлодарского городского маслихата Павлодарской области от 17 декабря 2025 года № 289/35
title:
  rus: Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2026 год
  kaz: 2026 жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшерін және қағидаларын бекіту туралы
