  title:
    rus: О внесении изменения в решение Павлодарского городского маслихата от 2 мая 2019 года № 376/51 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2019 год»
    kaz: Павлодар қалалық мәслихатының 2019 жылғы 2 мамырдағы «2019 жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 376/51 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/135622/rus
