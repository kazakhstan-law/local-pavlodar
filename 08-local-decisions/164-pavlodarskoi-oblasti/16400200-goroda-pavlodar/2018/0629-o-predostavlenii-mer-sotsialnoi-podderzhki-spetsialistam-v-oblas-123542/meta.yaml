requisite: Решение маслихата города Павлодара Павлодарской области от 29 июня 2018 года № 272/37. Зарегистрировано Департаментом юстиции Павлодарской области 17 июля 2018 года № 6024
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2018 год
  kaz: 2018  жылға Павлодар қаласының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету туралы
