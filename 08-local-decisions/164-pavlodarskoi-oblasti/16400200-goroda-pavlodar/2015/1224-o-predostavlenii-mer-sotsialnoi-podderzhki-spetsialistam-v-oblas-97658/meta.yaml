act_code: '97658'
requisite: 'Решение маслихата города Павлодар Павлодарской области от 24 декабря 2015 года № 456/61. Зарегистрировано Департаментом юстиции Павлодарской области 15 января 2016 года № 4889 '
title:
  rus: 'О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2016 год '
  kaz: '2016 жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік  қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы  '
