  title:
    rus: О внесении изменений в решение Павлодарского городского маслихата от 16 сентября 2020 года № 523/70 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в городе Павлодаре»
    kaz: Павлодар қалалық мәслихатының 2020 жылғы 16 қыркүйектегі № 523/70 «Павлодар қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
