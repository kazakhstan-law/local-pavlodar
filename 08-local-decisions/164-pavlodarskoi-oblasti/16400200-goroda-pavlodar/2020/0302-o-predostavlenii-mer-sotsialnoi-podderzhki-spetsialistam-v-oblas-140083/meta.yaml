act_code: '140083'
requisite: Решение маслихата города Павлодара Павлодарской области от 2 марта 2020 года № 458/63. Зарегистрировано Департаментом юстиции Павлодарской области 6 марта 2020 года № 6741. Утратило силу решением Павлодарского городского маслихата Павлодарской области от 3 ноября 2020 года № 530/71 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2020 год
  kaz: 2020 жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
