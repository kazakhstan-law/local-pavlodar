  title:
    rus: О внесении изменений в решение Павлодарского городского маслихата «Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими  и работающим в сельских населенных пунктах города Павлодара, а также указанным специалистам, работающим в государственных организациях, финансируемых из местного бюджета» от 23 декабря 2020 года № 555/73
    kaz: Павлодар қалалық мәслихатының «Азаматтық қызметшілер болып табылатын және Павлодар қаласының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» 2020 жылғы 23 желтоқсандағы № 555/73 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158761/rus
