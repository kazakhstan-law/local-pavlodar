requisite: Решение Павлодарского городского маслихата Павлодарской области от 23 декабря 2020 года № 555/73. Зарегистрировано Департаментом юстиции Павлодарской области 28 декабря 2020 года № 7120
title:
  rus: Об установлении повышенных окладов и тарифных ставок специалистам в области социального обеспечения, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах города Павлодара, финансируемых из местного бюджета
  kaz: Азаматтық қызметшілер болып табылатын және жергілікті бюджеттен қаржыландырылатын Павлодар қаласының ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет, спорт саласындағы мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
