act_code: '108888'
requisite: Решение маслихата города Павлодара Павлодарской области от 23 декабря 2016 года № 97/15. Зарегистрировано Департаментом юстиции Павлодарской области 10 января 2017 года № 5335
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Павлодара на 2017 год
  kaz: 2017 жылға арналған Павлодар қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
