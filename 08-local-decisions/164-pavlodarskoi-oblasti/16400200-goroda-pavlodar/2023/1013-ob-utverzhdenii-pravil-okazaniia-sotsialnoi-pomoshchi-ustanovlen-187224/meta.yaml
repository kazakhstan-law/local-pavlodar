requisite: Решение Павлодарского городского маслихата Павлодарской области от 13 октября 2023 года № 65/8. Зарегистрировано в Департаменте юстиции Павлодарской области 16 октября 2023 года № 7406-14. Утратило силу решением Павлодарского городского маслихата Павлодарской области от 3 июня 2026 года № 324/42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
