act_code: '156594'
requisite: Решение акима сельского округа Кемеңгер Павлодарского района Павлодарской области от 22 июня 2021 года № 1-03-1. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июня 2021 года № 23179. Утратило силу решением акима сельского округа Кемеңгер Павлодарского района Павлодарской области от 3 декабря 2021 года № 1-03-4 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории села Шанды сельского округа Кемеңгер Павлодарского района
  kaz: Павлодар ауданы Кемеңгер ауылдық округінің Шанды ауылының аумағында шектеу іс-шараларын белгілеу туралы
