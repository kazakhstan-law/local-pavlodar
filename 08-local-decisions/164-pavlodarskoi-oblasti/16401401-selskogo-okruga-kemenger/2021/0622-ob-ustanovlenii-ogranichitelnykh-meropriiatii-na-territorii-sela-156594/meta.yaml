  code: '159814'
  requisite: Решение акима сельского округа Кемеңгер Павлодарского района Павлодарской области от 22 октября 2021 года № 1-03-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 октября 2021 года № 24943. Утратило силу решением акима сельского округа Кемеңгер Павлодарского района Павлодарской области от 3 декабря 2021 года № 1-03-4 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О снятии ограничительных мероприятий на территории станции Красноармейка и внесении изменений в решение акима сельского округа Кемеңгер от 22 июня 2021 года № 1-03-1 «Об установлении ограничительных мероприятий на территории села Шанды и станции Красноармейка сельского округа Кемеңгер Павлодарского района»
    kaz: Кемеңгер ауылдық округі әкімінің 2021 жылғы 22 маусымдағы «Павлодар ауданы Кемеңгер ауылдық округінің Шанды ауылы және Красноармейка станциясының аумағында шектеу іс-шараларын белгілеу туралы» № 1-03-1 шешіміне өзгерістер енгізу және Красноармейка станциясының аумағында белгіленген шектеу іс-шараларын алып тастау туралы
