title:
  rus: О признании утратившим силу ранее принятого решения акима Панфиловского сельского округа № 4 от 06 октября 2015 года «Об установлении ограничительных мероприятий на улице имени Муткенова в селе Панфилово Панфиловского сельского округа Иртышского района»
  kaz: Бұрын, 2015 жылғы 06 қазанда қабылданған, Панфилов ауылдық округі әкімінің «Ертіс ауданы Панфилов ауылдық округі Панфилов ауылындағы Мүткенов атындағы көшесіне шектеулі іс-шаралар белгілеу туралы» № 4 шешімінің күшін жою туралы
