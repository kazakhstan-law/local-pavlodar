  kaz: Бұрын, 2015 жылғы 06 қазанда қабылданған, Панфилов ауылдық округі әкімінің «Ертіс ауданы Панфилов ауылдық округінің Тоқта ауылының Әутәліпов атындағы көшесіне карантин белгілеу туралы» № 3 шешімінің күшін жою туралы
