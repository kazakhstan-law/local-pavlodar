act_code: '100411'
requisite: Решение маслихата Павлодарского района Павлодарской области от 4 марта 2016 года № 58/423. Зарегистрировано Департаментом юстиции Павлодарской области 18 марта 2016 года № 5005. Утратило силу решением маслихата Павлодарского района Павлодарской области от 07 июля 2016 года № 4/38 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставки земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Павлодарского района Павлодарской области
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Павлодар ауданының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
