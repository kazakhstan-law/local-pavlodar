act_code: '98652'
requisite: Решение маслихата Павлодарского района от 28 января 2016 года № 57/418. Зарегистрировано Департаментом юстиции Павлодарской области 04 февраля 2016 года № 4918. Утратило силу решением маслихата Павлодарского района Павлодарской области от 17 июля 2017 года № 18/109 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в  сельские населенные пункты Павлодарского района на 2016 год
  kaz: 2016 жылға арналған Павлодар ауданының ауылдық  елді  мекендеріне  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік колдау шараларын ұсыну туралы
