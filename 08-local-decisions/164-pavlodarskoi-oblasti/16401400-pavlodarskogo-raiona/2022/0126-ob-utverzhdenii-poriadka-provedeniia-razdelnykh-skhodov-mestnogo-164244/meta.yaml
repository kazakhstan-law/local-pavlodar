requisite: Решение Павлодарского районного маслихата Павлодарской области от 26 января 2022 года № 20/108. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 19 октября 2023 года № 8/89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села для участия в сходе местного сообщества на территории сельского округа Кемеңгер Павлодарского района
  kaz: Павлодар ауданы Кемеңгер ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
