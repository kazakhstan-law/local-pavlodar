requisite: Решение Павлодарского районного маслихата Павлодарской области от 25 ноября 2022 года № 31/180. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 19 октября 2023 года № 8/87 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села для участия в сходе местного сообщества на территории Григорьевского сельского округа Павлодарского района
  kaz: Павлодар ауданы Григорьевка ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
