act_code: '150852'
requisite: Решение Павлодарского районного маслихата Павлодарской области от 23 декабря 2020 года № 78/365. Зарегистрировано Департаментом юстиции Павлодарской области 29 декабря 2020 года № 7132
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания  в  сельские населенные пункты Павлодарского района на 2020 год
  kaz: 2020 жылға арналған Павлодар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік колдау шараларын көрсету туралы
