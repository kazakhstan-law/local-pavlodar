  title:
    rus: О внесении изменения и дополнений в решение Павлодарского районного маслихата от 15 мая 2020 года № 71/315 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Павлодарского района»
    kaz: Павлодар аудандық мәслихатының 2020 жылғы 15 мамырдағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Павлодар ауданы мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 71/315 шешіміне өзгеріс және толықтырулар енгізу туралы
