requisite: Решение Павлодарского районного маслихата Павлодарской области от 23 декабря 2020 года № 78/367. Зарегистрировано Департаментом юстиции Павлодарской области 8 января 2021 года № 7167. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 26 января 2022 года № 20/108 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сёл для участия в сходе местного сообщества на территории сельского округа Кемеңгер Павлодарского района
  kaz: Павлодар ауданы Кемеңгер ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы
