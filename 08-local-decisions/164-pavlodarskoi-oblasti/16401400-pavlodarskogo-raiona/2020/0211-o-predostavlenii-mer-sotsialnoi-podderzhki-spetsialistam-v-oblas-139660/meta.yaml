requisite: Решение маслихата Павлодарского района Павлодарской области от 11 февраля 2020 года № 66/290. Зарегистрировано Департаментом юстиции Павлодарской области 19 февраля 2020 года № 6728. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 23 декабря 2020 года № 78/365 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Павлодарского района на 2020 год
  kaz: 2020 жылға арналған Павлодар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік колдау шараларын ұсыну туралы
