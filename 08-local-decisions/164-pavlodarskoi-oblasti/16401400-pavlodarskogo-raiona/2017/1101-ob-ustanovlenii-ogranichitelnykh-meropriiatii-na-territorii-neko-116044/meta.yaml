requisite: Решение исполняющего обязанности акима Григорьевского сельского округа Павлодарского района Павлодарской области от 1 ноября 2017 года № 1-04-8. Зарегистрировано Департаментом юстиции Павлодарской области 17 ноября 2017 года № 5688. Утратило силу решением акима Григорьевского сельского округа Павлодарского района Павлодарской области от 2 октября 2018 года № 1-04-7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
