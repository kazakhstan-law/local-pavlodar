requisite: Решение маслихата Павлодарского района Павлодарской области от 7 февраля 2017 года № 13/81. Зарегистрировано Департаментом юстиции Павлодарской области 21 февраля 2017 года № 5383
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в  сельские населенные пункты Павлодарского района на 2017 год
  kaz: 2017 жылға арналған Павлодар ауданының ауылдық  елді  мекендеріне  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
