act_code: '117654'
requisite: Решение маслихата Павлодарского района Павлодарской области от 27 декабря 2017 года № 26/144. Зарегистрировано Департаментом юстиции Павлодарской области 8 января 2018 года № 5787. Утратило силу решением маслихата Павлодарского района Павлодарской области от 22 ноября 2019 года № 62/275 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Павлодарского района
  kaz: Павлодар ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
