requisite: Решение Павлодарского районного маслихата Павлодарской области от 15 декабря 2023 года № 10/112
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Павлодарского района на 2024 год
  kaz: 2024 жылға арналған Павлодар ауданының ауылдық елді мекендеріне  жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік колдау шараларын көрсету туралы
