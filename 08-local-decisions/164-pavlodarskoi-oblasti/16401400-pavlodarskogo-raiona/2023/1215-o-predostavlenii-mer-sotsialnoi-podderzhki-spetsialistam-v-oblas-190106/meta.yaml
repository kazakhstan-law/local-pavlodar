  title:
    rus: О внесении изменения в решение Павлодарского районного маслихата от 15 декабря 2023 года № 10/112 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Павлодарского района на 2024 год»
    kaz: Павлодар аудандық мәслихатының 2023 жылғы 15 желтосандағы «2024 жылға арналған Павлодар ауданының ауылдық елді мекендеріне  жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік колдау шараларын көрсету туралы» № 10/112 шешіміне өзгеріс енгізу туралы
