  title:
    rus: О внесении изменения в решение Павлодарского районного маслихата от 21 ноября 2023 года № 9/103 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Павлодарского района»
    kaz: Павлодар аудандық мәслихатының 2023 жылғы 21 қарашадағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Павлодар ауданы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 9/103 шешіміне өзгеріс енгізу туралы
