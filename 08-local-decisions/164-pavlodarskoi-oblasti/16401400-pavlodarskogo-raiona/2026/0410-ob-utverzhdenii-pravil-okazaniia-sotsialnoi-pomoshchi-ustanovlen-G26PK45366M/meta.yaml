  title:
    rus: О внесении изменений в решение Павлодарского районного маслихата Павлодарской области от 10 апреля 2026 года № 45/366 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Павлодарского района»
    kaz: Павлодар облысы Павлодар аудандық мәслихатының 2026 жылғы 10 сәуірдегі «Әлеуметтік көмек көрсетудің, оның мөлшелерін белгілеудің және Павлодар ауданы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 45/366 шешіміне өзгерістер енгізу туралы
