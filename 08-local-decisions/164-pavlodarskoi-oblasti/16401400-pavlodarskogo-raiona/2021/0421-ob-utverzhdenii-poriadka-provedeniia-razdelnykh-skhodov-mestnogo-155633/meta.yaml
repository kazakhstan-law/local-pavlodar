requisite: Решение Павлодарского районного маслихата Павлодарской области от 21 апреля 2021 года № 3/27. Зарегистрировано Департаментом юстиции Павлодарской области 6 мая 2021 года № 7275. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 26 января 2022 года № 20/106 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сёл для участия в сходе местного сообщества на территории Черноярского сельского округа Павлодарского района
  kaz: Павлодар ауданы Черноярка ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы
