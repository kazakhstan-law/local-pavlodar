requisite: Решение Павлодарского районного маслихата Павлодарской области от 12 февраля 2021 года № 2/15. Зарегистрировано Департаментом юстиции Павлодарской области 22 февраля 2021 года № 7216. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 26 января 2022 года № 20/102 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сёл для участия в сходе местного сообщества на территории Мичуринского сельского округа Павлодарского района
  kaz: Павлодар ауданы Мичурин ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің тәртібін бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын айқындау туралы
