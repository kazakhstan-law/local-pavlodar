requisite: Решение Павлодарского районного маслихата Павлодарской области от 21 апреля 2021 года № 3/26. Зарегистрировано Департаментом юстиции Павлодарской области 6 мая 2021 года № 7276. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 26 января 2022 года № 20/105 (вводится в действие со дня его первого официального опубликования)
title:
