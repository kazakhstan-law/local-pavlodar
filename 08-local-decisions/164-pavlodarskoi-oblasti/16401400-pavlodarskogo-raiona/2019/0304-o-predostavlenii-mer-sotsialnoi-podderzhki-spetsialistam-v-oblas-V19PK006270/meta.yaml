  title:
    rus: О внесении изменения в решение Павлодарского районного маслихата от 4 марта 2019 года № 50/227 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Павлодарского района на 2019 год»
    kaz: Павлодар аудандық мәслихатының 2019 жылғы 4 наурыздағы «2019 жылға арналған Павлодар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік колдау шараларын ұсыну туралы» № 50/227 шешіміне өзгеріс енгізу туралы
