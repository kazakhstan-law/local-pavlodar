requisite: Решение маслихата Павлодарского района Павлодарской области от 4 марта 2019 года № 50/227. Зарегистрировано Департаментом юстиции Павлодарской области 14 марта 2019 года № 6270
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Павлодарского района на 2019 год
  kaz: 2019 жылға арналған Павлодар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
