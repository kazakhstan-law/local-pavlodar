requisite: Решение маслихата Павлодарского района Павлодарской области от 2 апреля 2015 года № 44/349. Зарегистрировано Департаментом юстиции Павлодарской области 21 апреля 2015 года № 4435
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в  сельские населенные пункты Павлодарского района на 2015 год
  kaz: 2015 жылға арналған Павлодар ауданының ауылдық елді мекендеріне  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын  ұсыну туралы
