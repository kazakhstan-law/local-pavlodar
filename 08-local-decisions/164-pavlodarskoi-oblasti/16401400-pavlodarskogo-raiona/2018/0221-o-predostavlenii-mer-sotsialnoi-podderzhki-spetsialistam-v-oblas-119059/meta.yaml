requisite: Решение маслихата Павлодарского района Павлодарской области от 21 февраля 2018 года № 28/149. Зарегистрировано Департаментом юстиции Павлодарской области 28 февраля 2018 года № 5873
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в  сельские населенные пункты Павлодарского района на 2018 год
  kaz: 2018 жылға арналған Павлодар ауданының ауылдық  елді  мекендеріне  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
