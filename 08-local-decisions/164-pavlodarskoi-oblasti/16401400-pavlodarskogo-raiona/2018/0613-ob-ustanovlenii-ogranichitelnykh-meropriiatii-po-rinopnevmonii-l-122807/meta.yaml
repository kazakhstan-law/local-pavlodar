requisite: Решение акима Григорьевского сельского округа Павлодарского района Павлодарской области от 13 июня 2018 года № 1-04-2. Зарегистрировано Департаментом юстиции Павлодарской области 21 июня 2018 года № 5998. Утратило силу решением акима Григорьевского сельского округа Павлодарского района Павлодарской области от 29 ноября 2018 года № 1-04-12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий по ринопневмонии лошадей на территории некоторых населенных пунктов Григорьевского сельского округа Павлодарского района
