requisite: Решение маслихата Павлодарского района Павлодарской области от 24 сентября 2014 года № 39/279. Зарегистрировано Департаментом юстиции Павлодарской области 06 октября 2014 года № 4053. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 12 февраля 2021 года № 2/15 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Мичуринского сельского округа Павлодарского района
