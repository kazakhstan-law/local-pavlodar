act_code: '81061'
requisite: Решение маслихата Павлодарского района Павлодарской области от 13 июня 2014 года № 34/251. Зарегистрировано Департаментом юстиции Павлодарской области 03 июля 2014 года № 3861. Утратило силу решением маслихата Павлодарского района Павлодарской области от 27 декабря 2017 года № 26/144 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Павлодарского района
  kaz: Павлодар ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
