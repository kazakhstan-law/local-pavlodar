  title:
    rus: О внесении изменения и дополнения в решение Павлодарского районного маслихата от 27 февраля 2014 года № 30/227 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Павлодарского района»
