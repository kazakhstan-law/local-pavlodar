requisite: Решение маслихата Павлодарского района Павлодарской области от 26 декабря 2014 года № 41/317. Зарегистрировано Департаментом юстиции Павлодарской области 04 февраля 2015 года № 4295. Утратило силу решением маслихата Павлодарского района Павлодарской области от 4 мая 2019 года № 53/241 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении проекта (схем) зонирования земель сельскохозяйственного назначения и сельских населенных пунктов Павлодарского района для целей налогообложения и поправочных коэффициентов к базовым ставкам земельного налога
  kaz: Салық салу және жер салығының базалық ставкаларына түзету коэффициенттері мақсаттары үшін Павлодар ауданының ауыл шаруашылығы мақсатындағы жерлерін және ауылдық елді мекендер жерлерін жерді аймақтарға бөлу жобасын (схемаларын) бекіту туралы
