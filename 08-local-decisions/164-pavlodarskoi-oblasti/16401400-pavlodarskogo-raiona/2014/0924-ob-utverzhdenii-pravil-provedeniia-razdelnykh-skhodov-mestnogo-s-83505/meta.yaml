requisite: Решение маслихата Павлодарского района Павлодарской области от 24 сентября 2014 года № 39/282. Зарегистрировано Департаментом юстиции Павлодарской области 06 октября 2014 года № 4063. Утратило силу решением Павлодарского районного маслихата Павлодарской области от 25 ноября 2022 года № 31/175 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
