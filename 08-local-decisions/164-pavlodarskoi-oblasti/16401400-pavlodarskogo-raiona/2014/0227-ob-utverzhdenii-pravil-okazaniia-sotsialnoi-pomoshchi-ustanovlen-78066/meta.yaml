    kaz: Павлодар аудандық мәслихатының (5 сайланған 30 кезекті сессиясы) 2014 жылғы 27 ақпандағы «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және Павлодар ауданы мұқтаж азаматтарының жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекiту туралы» № 30/227 шешiмiне өзгерiстер және  толықтыру енгiзу туралы
