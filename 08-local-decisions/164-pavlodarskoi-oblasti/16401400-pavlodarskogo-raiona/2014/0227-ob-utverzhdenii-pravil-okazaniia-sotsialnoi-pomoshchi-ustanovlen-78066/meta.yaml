  title:
    rus: О внесении изменений и дополнений в решение Павлодарского районного маслихата (30 очередная сессия, 5 созыв) от 27 февраля 2014 года № 30/227 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Павлодарского района»
    kaz: Павлодар аудандық мәслихатының (5 сайланған 30 кезекті сессиясы) 2014 жылғы 27 ақпандағы «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және Павлодар ауданы мұқтаж азаматтарының жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекiту туралы» № 30/227 шешiмiне өзгерiстер мен толықтырулар енгiзу туралы
