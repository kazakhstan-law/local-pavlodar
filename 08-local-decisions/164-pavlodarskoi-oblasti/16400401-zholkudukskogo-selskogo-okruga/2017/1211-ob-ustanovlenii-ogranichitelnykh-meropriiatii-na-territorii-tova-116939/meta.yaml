requisite: Решение исполняющего обязанности акима Кызылжарского сельского округа города Аксу Павлодарской области от 11 декабря 2017 года № 1-04/06. Зарегистрировано Департаментом юстиции Павлодарской области 21 декабря 2017 года № 5750. Утратило силу решением акима Кызылжарского сельского округа города Аксу Павлодарской области от 4 июля 2018 года № 1-04/4 (вводится в действие со дня его первого официального опубликования)
title:
