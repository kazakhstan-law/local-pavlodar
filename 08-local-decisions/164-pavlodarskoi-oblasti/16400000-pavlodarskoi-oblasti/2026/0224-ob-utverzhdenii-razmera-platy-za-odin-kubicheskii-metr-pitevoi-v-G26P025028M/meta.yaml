  rus: Об утверждении размера платы за один кубический метр питьевой воды, поданной из систем водоснабжения, включенных в перечень систем водоснабжения, стоимость услуг по подаче питьевой воды которых подлежит субсидированию в Павлодарской области
  kaz: Павлодар облысында ауыз су беру жөніндегі көрсетілетін қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесіне енгізілген, сумен жабдықтау жүйелерінен берілген ауыз судың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
