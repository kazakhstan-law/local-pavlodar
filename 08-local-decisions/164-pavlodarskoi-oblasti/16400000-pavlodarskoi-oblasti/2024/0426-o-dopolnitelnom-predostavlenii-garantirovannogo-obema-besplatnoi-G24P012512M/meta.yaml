  title:
    rus: О внесении дополнений в решение Павлодарского областного маслихата  от 26 апреля 2024 года № 125/12 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированных на территории Павлодарской области  при амбулаторном лечении бесплатно»
    kaz: Павлодар облыстық мәслихатының 2024 жылғы 26 сәуірдегі  «Павлодар облысы аумағында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық  бұйымдарды қосымша тегін беру туралы»  № 125/12 шешіміне толықтырулар енгізу туралы
