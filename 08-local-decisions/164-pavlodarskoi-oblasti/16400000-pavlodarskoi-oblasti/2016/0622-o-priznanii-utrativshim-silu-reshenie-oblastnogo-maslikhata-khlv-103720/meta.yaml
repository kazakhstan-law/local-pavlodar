title:
  rus: О признании утратившим силу  решение областного маслихата (ХLVI сессия, V созыв) от 10 декабря 2015 года № 407/46 «Об утверждении перечня социально значимых убыточных маршрутов, подлежащих субсидированию в Павлодарской области на 2016 год»
  kaz: Облыстық мәслихаттың 2015 жылғы 10 желтоқсандағы (V сайланған XLVI сессиясы) «2016 жылға Павлодар облысында субсидиялауға жататын әлеуметтік маңызы бар шығынды маршруттардың тізбесін бекіту туралы» № 407/46 шешімінің күшін жою туралы.
