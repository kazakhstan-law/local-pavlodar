act_code: '102625'
requisite: Решение акима Павлодарской области от 18 апреля 2016 года № 2. Зарегистрировано Департаментом юстиции Павлодарской области 25 мая 2016 года № 5137. Утратило силу решением акима Павлодарской области от 26 июня 2018 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении системы управления рисками, которая применяется службой внутреннего аудита аппарата акима Павлодарской области при формировании перечня объектов государственного аудита и финансового контроля на соответствующий год и проведении внутреннего государственного аудита и критериев рисков
  kaz: Тиісті жылға арналған мемлекеттік аудит және қаржылық бақылау объектілерінің тізбесін қалыптастыру және ішкі мемлекеттік аудит жүргізу кезінде Павлодар облысы әкімі аппаратының ішкі бақылау қызметімен қолданылатын тәуекелдерді басқару жүйесін және тәуекел критерийлерін бекіту туралы
