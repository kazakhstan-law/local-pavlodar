requisite: Решение акима Павлодарской области от 20 февраля 2015 года № 1. Зарегистрировано Департаментом юстиции Павлодарской области 04 марта 2015 года № 4334. Утратило силу решением акима Павлодарской области от 27 января 2016 года N 1
title:
  rus: Об определении единого организатора государственных закупок для бюджетных организаций  Павлодарской области и товаров, работ, услуг, по которым организация и проведение государственных закупок осуществляется единым организатором
  kaz: Павлодар облысының бюджеттік ұйымдары үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын және мемлекеттік сатып алуды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы жүзеге асыратын тауарларды, жұмыстарды, қызметтерді анықтау туралы
