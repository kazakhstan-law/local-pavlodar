requisite: Решение Акима Павлодарской области от 6 февраля 2001 года № 34. Зарегистрировано управлением юстиции Павлодарской области 30 марта 2001 года № 605. Утратило силу - решением акима Павлодарской области от 16 августа 2002 года № 28
title:
  rus: О правилах подготовки и проведения государственных закупок товаров, работ и услуг для нужд государственных учреждений области, содержащихся за счет средств местных бюджетов
  kaz: Жергiлiктi бюджеттер қаражаттары есебiнен ұсталатын облыс мемлекеттiк мекемелерiнiң қажеттiлiктерi үшiн товарлар, жұмыс пен қызмет түрлерiн мемлекеттiк сатып алуларды дайындау және өткiзу ережелерi туралы
