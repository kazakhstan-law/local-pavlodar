  requisite: Решение Павлодарского областного маслихата от 15 мая 2026 года № 271/30
  title:
    rus: О внесении изменений и дополнений в решение Павлодарского областного маслихата от 11 декабря 2020 года № 539/44 «Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из областного бюджета»
    kaz: Павлодар облыстық мәслихатының 2020 жылғы 11 желтоқсандағы «Азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ облыстық бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» № 539/44 шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/225435/rus
