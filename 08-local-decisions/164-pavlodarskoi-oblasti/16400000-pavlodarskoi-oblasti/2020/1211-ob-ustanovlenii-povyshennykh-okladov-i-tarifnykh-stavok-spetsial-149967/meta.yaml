act_code: '149967'
requisite: Решение Павлодарского областного маслихата от 11 декабря 2020 года № 539/44. Зарегистрировано Департаментом юстиции Павлодарской области 20 декабря 2020 года № 7099
title:
  rus: Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, архивного дела, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из областного бюджета
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, архив ісі, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ облыстық бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
