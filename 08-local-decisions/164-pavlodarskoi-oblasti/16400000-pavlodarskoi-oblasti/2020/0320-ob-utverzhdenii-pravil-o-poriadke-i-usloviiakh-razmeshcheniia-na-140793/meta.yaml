  requisite: Решение Павлодарского областного маслихата от 15 мая 2026 года № 273/30
  title:
    rus: О внесении изменений в решение Павлодарского областного маслихата от 20 марта 2020 года № 446/38 «Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования Павлодарской области»
    kaz: Павлодар облыстық мәслихатының 2020 жылғы 20 наурыздағы «Павлодар облысының елді мекендеріндегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде сыртқы (көрнекі) жарнаманы орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы» № 446/38 шешіміне өзгерістер енгізу туралы
