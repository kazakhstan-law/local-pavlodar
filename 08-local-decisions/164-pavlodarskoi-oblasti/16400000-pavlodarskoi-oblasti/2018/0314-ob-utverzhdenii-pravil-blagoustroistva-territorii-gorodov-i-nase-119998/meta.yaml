  requisite: Решение маслихата Павлодарской области от 20 марта 2020 года № 447/38. Зарегистрировано Департаментом юстиции Павлодарской области 31 марта 2020 года № 6786. Утратило силу решением Павлодарского областного маслихата от 11 июля 2024 года № 135/14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в решение Павлодарского областного маслихата от 14 марта 2018 года № 220/21 «Об утверждении Правил содержания и защиты зеленых насаждений Павлодарской области, Правил благоустройства территорий городов и населенных пунктов Павлодарской области»
    kaz: Павлодар облыстық мәслихатының 2018 жылғы 14 наурыздағы «Павлодар облысының жасыл екпелерін күтіп-ұстау және қорғау қағидаларын, Павлодар облысының қалалары мен елді мекендерінің аумақтарын абаттандырудың қағидаларын бекіту туралы» № 220/21 шешіміне өзгерістер мен толықтыру енгізу туралы
