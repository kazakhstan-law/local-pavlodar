  title:
    rus: О внесении изменений в решение Павлодарского областного маслихата от 14 марта 2018 года № 220/21 «Об утверждении Правил содержания и защиты зеленых насаждений Павлодарской области, Правил благоустройства территорий городов и населенных пунктов Павлодарской области»
    kaz: Павлодар облыстық мәслихатының 2018 жылғы 14 наурыздағы № 220/21 «Павлодар облысының жасыл екпелерін күтіп-ұстау және қорғау қағидаларын, Павлодар облысының қалалары мен елді мекендерінің аумақтарын абаттандырудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
