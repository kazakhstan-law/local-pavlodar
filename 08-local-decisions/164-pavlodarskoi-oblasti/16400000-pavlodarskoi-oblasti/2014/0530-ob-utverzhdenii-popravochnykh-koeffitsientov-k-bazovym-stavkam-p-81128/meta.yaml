  title:
    rus: О внесении изменений в решение маслихата Павлодарской области от 30 мая 2014 года № 265/31 «Об утверждении поправочных коэффициентов к базовым ставкам платы за земельные участки и границ оценочных зон города Экибастуза и сельских населенных пунктов»
    kaz: Павлодар облыстық мәслихатының 2014 жылғы 30 мамырдағы № 265/31 «Екібастұз қаласы мен ауылдық елді мекендерінің жер учаскелері және аймақтарының шекараларын бағалау үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
