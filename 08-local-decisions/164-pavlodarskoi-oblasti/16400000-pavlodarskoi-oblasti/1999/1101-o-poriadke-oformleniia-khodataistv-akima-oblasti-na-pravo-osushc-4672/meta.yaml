requisite: Решение акима Павлодарской области от 1 ноября 1999 года № 230. Зарегистрировано Управлением юстиции Павлодарской области 11 ноября 1999 года за № 194. Утратило силу решением акима Павлодарской области от 29 октября 2004 года № 25
title:
  rus: О порядке оформления ходатайств акима области на право осуществления лицензируемой деятельности по сбору и реализации лома, отходов черных и цветных металлов
  kaz: Облыс әкімінің қара және түсті металдар сынықтарын, қалдықтарын жинау мен сату жөніндегі қызметті лицензиялауды жүзеге асыруға құқық беретін өтінішін рәсімдеу тәртібі туралы
