act_code: '23362'
requisite: Решение акима Павлодарской области от 1 марта 2005 года № 3. Зарегистрировано Департаментом юстиции Павлодарской области 28 марта 2005 года за № 2937. Утратило силу - решением маслихата Павлодарской области от 3 мая 2007 года № 6
title:
  rus: Об утверждении Правил взаимодействия акима Павлодарской области с Налоговым комитетом Министерства финансов Республики Казахстан и Правил взаимодействия акима Павлодарской области с департаментом по борьбе с экономической и коррупционной преступностью (финансовая полиция) по Павлодарской области по виду деятельности "сбор (заготовка), хранение, переработка и реализация юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және сату" қызмет түрі бойынша Павлодар облысы әкімінің Қазақстан Республикасы Қаржы министрлігінің Салық комитетімен өзара іс-қимыл ережесін және Павлодар облысы әкімінің Павлодар облысы бойынша экономикалық және сыбайлас жемқорлық қылмысқа қарсы күрес жөніндегі департаментпен (қаржы полициясы) өзара іс-қимыл ережесін бекіту туралы'
