act_code: '155631'
requisite: Решение Павлодарского областного маслихата от 22 апреля 2021 года № 21/3. Зарегистрировано Департаментом юстиции Павлодарской области 6 мая 2021 года № 7274. Утратило силу решением Павлодарского областного маслихата от 26 апреля 2024 года № 126/12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированных на территории Павлодарской области при амбулаторном лечении бесплатно
  kaz: Павлодар облысы аумағында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы
