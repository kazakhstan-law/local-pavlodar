  title:
    rus: О внесении изменения в решение Павлодарского областного маслихата от 22 апреля 2021 года № 21/3 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Павлодарской области при амбулаторном лечении»
    kaz: Павлодар облыстық мәслихатының 2021 жылғы 22 сәуірдегі № 21/3 «Павлодар облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» шешіміне өзгеріс енгізу туралы
