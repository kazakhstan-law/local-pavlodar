act_code: '161434'
requisite: Решение Павлодарского областного маслихата от 26 ноября 2021 года № 83/8. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 декабря 2021 года № 25667
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан, проживающим в Павлодарской области, за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Павлодар облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
