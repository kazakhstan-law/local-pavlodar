  title:
    rus: О внесении изменений в решение Павлодарского областного маслихата от 26 ноября 2021 года № 82/8 «Об определении порядка и размера оказания социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельскую местность и поселки, города областного значения Павлодарской области за счет бюджетных средств»
    kaz: Павлодар облыстық мәслихатының 2021 жылғы 26 қарашадағы № 82/8 «Павлодар облысының ауылдық жеріне және кенттеріне, облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
