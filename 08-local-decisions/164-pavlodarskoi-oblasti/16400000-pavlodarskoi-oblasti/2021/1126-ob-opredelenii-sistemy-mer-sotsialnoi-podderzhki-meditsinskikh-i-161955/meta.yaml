requisite: Решение Павлодарского областного маслихата от 26 ноября 2021 года № 82/8. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2021 года № 25907
title:
  rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности и поселках, городах областного значения Павлодарской области, а также порядка и размера оказания им социальной поддержки за счет бюджетных средств
  kaz: Павлодар облысының ауылдық жеріне және кенттеріне, облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлерін әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы
