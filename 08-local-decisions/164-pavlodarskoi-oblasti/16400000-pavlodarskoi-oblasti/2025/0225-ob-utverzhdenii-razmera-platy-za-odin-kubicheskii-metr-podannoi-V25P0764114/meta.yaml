  kaz: Павлодар облысында ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
