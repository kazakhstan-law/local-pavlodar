requisite: Решение Павлодарского областного маслихата от 25 февраля 2025 года № 183/19. Зарегистрировано в Департаменте юстиции Павлодарской области 28 февраля 2025 года № 7641-14. Утратило силу решением Павлодарского областного маслихата от 26 марта 2026 года № 260/29 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
title:
