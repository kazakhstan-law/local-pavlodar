act_code: '175766'
requisite: Решение Железинского районного маслихата Павлодарской области от 21 декабря 2022 года № 213/7
title:
  rus: Опредоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2023 году
  kaz: 2023 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеужәне тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
