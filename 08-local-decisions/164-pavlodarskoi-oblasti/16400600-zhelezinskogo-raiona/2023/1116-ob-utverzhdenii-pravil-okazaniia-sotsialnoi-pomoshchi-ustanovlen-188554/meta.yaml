  title:
    rus: О внесении изменения и дополнения в решение Железинского районного маслихата от 16 ноября 2023 года № 63/8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Железинского района»
    kaz: Железин аудандық мәслихатының 2023 жылғы 16 қарашадагы № 63/8 «Железин ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
