act_code: '189882'
requisite: Решение Железинского районного маслихата Павлодарской области от 12 декабря 2023 года № 79/8
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2024 году
  kaz: 2024 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеужәне тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
