  title:
    rus: О внесении изменений и дополнений в решение Железинского районного маслихата от 5 марта 2014 года № 176-5/25 «Об  утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Железинского района»
    kaz: Железинка аудандық мәслихатының 2014 жылғы 5 наурыздағы «Железинка ауданындағы әлеуметтік  көмек көрсетудің, оның мөлшерлерін белгілеудің  және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіт туралы» № 176-5/25 шешіміне өзгерістер мен толықтырулар енгізу туралы
