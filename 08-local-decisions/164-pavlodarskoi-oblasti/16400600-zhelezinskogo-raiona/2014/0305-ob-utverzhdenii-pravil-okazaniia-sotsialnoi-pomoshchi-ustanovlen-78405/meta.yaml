    kaz: Железинка аудандық мәслихатының 2014 жылғы 5 наурыздағы "Железинка ауданындағы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" № 176-5/25 шешіміне өзгерістер енгізу туралы
