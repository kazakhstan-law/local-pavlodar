requisite: Решение маслихата Железинского района Павлодарской области от 05 ноября 2014 года № 223-5/30. Зарегистрировано Департаментом юстиции Павлодарской области 21 ноября 2014 года № 4174. Утратило силу решением маслихата Железинского района Павлодарской области от 4 марта 2020 года № 434/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Железинского района
  kaz: Железин ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, білім, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек ұсыну туралы
