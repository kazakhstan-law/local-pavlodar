requisite: Решение маслихата Железинского района Павлодарской области от 05 ноября 2014 года № 232-5/30. Зарегистрировано Департаментом юстиции Павлодарской области 26 ноября 2014 года № 4188. Утратило силу решением Железинского районного маслихата Павлодарской области от 16 ноября 2023 года № 64/8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
