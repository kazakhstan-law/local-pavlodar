act_code: '88801'
requisite: Решение маслихата Железинского района Павлодарской области от 30 марта 2015 года № 285-5/35. Зарегистрировано Департаментом юстиции Павлодарской области 17 апреля 2015 года № 4425. Утратило силу решением маслихата Железинского района Павлодарской области от 14 апреля 2016 года № 14/6 (вводится в действие со дня подписания)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Железинского района на 2015 год
  kaz: 2015 жылға Железин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
