act_code: '140193'
requisite: Решение маслихата Железинского района Павлодарской области от 4 марта 2020 года № 433/6. Зарегистрировано Департаментом юстиции Павлодарской области 12 марта 2020 года № 6744. Утратило силу решением Железинского районного маслихата Павлодарской области от 26 ноября 2020 года № 492/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2020 году
  kaz: 2020 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
