  title:
    rus: О внесении изменения в решение Железинского районного маслихата от 4 марта 2020 года № 434/6 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Железинского района»
    kaz: Железин аудандық мәслихатының 2020 жылғы 4 наурыздағы «Железин ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» № 434/6 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/170284/rus
