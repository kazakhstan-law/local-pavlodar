act_code: '149231'
requisite: Решение Железинского районного маслихата Павлодарской области от 26 ноября 2020 года № 492/6. Зарегистрировано Департаментом юстиции Павлодарской области 2 декабря 2020 года № 7056
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения,образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2020 году
  kaz: 2020 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
