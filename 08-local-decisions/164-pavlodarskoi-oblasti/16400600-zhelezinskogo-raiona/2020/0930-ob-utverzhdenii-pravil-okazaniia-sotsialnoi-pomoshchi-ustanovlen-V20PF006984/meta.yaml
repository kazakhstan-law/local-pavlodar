  title:
    rus: О  внесении изменений в решение Железинского районного маслихата от 30 сентября 2020 года № 486/6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Железинского района»
    kaz: Железин аудандық мәслихатының 2020 жылғы 30 қыркүйектегі № 486/6 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Железин ауданы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
