  requisite: Решение акима Железинского сельского округа Железинского района Павлодарской области от 11 марта 2021 года № 6. Зарегистрировано Департаментом юстиции Павлодарской области 11 марта 2021 года № 7225. Утратило силу решением акима Железинского сельского округа Железинского района Павлодарской области от 24 декабря 2021 года № 16 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение акима Железинского сельского округа Железинского района от 8 февраля 2021 года № 2 «Об установлении ограничительных мероприятий на территории товарищества с ограниченной ответственностью крестьянского хозяйства «Пахарь» Железинского сельского округа Железинского района»
    kaz: Железин ауданы Железин ауылдық округі әкімінің 2021 жылғы 8 ақпандағы «Железин ауданы Железин ауылдық округінің «Пахарь» шаруа қожалығы жауапкершілігі шектеулі серіктестігінің аумағында шектеу іс-шараларын белгілеу туралы» № 2 шешіміне өзгеріс енгізу туралы
