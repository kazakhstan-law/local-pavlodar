requisite: Решение акима Железинского сельского округа Железинского района Павлодарской области от 8 февраля 2021 года № 2. Зарегистрировано Департаментом юстиции Павлодарской области 9 февраля 2021 года № 7207. Утратило силу решением акима Железинского сельского округа Железинского района Павлодарской области от 24 декабря 2021 года № 16 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории товарищества с ограниченной ответственностью крестьянского хозяйства «Пахарь» Железинского сельского округа Железинского района
  kaz: Железин ауданы Железин ауылдық округінің «Пахарь» шаруа қожалығы жауапкершілігі шектеулі серіктестігінің аумағында шектеу іс-шараларын белгілеу туралы
