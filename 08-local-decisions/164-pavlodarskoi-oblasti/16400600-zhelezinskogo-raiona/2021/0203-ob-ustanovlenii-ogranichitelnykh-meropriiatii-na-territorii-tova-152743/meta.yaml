requisite: Решение исполняющего обязанности акима Алакольского сельского округа Железинского района Павлодарской области от 3 февраля 2021 года № 2. Зарегистрировано Департаментом юстиции Павлодарской области 9 февраля 2021 года № 7209. Утратило силу решением акима Алакольского сельского округа Железинского района Павлодарской области от 25 мая 2021 года № 5 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории Товарищества с ограниченной ответственностью крестьянского хозяйства «Пахарь» села Алаколь Алакольского сельского округа Железинского района
  kaz: Железин ауданы Алакөл ауылдық округінің Алакөл ауылының «Пахарь» шаруа қожалығы жауапкершілігі шектеулі серіктестігінің аумағында шектеу іс-шараларын белгілеу туралы
