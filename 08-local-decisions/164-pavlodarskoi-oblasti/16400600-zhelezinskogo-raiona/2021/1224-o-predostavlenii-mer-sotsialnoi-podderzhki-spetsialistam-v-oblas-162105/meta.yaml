act_code: '162105'
requisite: Решение Железинского районного маслихата Павлодарской области от 24 декабря 2021 года № 96/7
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения,образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2022 году
  kaz: 2022 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
