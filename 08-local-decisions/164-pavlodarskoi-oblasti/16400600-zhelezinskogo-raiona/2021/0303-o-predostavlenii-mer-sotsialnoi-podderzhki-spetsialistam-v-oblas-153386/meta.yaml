act_code: '153386'
requisite: Решение Железинского районного маслихата Павлодарской области от 3 марта 2021 года № 12/7. Зарегистрировано Департаментом юстиции Павлодарской области 11 марта 2021 года № 7223
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения,образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2021 году
  kaz: 2021 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
