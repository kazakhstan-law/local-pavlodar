  title:
    rus: О внесении изменений в решение Железинского районного маслихата Павлодарской области от 24 сентября 2021 года № 53/7 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Железинском районе»
    kaz: Павлодар облысы Железин аудандық мәслихатының 2021 жылғы 24 қыркүйектегі № 53/7 «Железин ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
