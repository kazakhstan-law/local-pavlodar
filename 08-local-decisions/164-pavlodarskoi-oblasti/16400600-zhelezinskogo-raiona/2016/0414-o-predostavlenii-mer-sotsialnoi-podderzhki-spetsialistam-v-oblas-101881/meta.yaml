act_code: '101881'
requisite: Решение маслихата Железинского района Павлодарской области от 14 апреля 2016 года № 7/6. Зарегистрировано Департаментом юстиции Павлодарской области 03 мая 2016 года № 5103. Утратило силу решением маслихата Железинского района Павлодарской области от 7 марта 2017 года № 70/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Железинского района в 2016 году
  kaz: 2016 жылы Железин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
