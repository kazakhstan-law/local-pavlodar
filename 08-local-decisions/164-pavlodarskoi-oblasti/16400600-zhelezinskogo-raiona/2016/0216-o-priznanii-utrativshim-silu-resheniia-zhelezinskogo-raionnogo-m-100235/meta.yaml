act_code: '100235'
requisite: Решение маслихата Железинского района Павлодарской области от 16 февраля 2016 года № 355-5/48
title:
  rus: О признании утратившим силу решения Железинского районного маслихата от 12 октября 2015 года № 326-5/41 «О повышении ставки земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Железинского района Павлодарской области»
  kaz: Железинка аудандық мәслихатының 2015 жылғы 12 қазандағы «Павлодар облысы Железин ауданының Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының мөлшерлемесін жоғарылату туралы» № 326-5/41 шешімінің күшін жою туралы
