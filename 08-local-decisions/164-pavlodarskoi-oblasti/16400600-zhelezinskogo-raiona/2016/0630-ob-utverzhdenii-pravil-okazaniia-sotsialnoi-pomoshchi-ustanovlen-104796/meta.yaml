requisite: Решение маслихата Железинского района Павлодарской области от 30 июня 2016 года № 22/6. Зарегистрировано Департаментом юстиции Павлодарской области 25 июля 2016 года № 5176. Утратило силу решением Железинского районного маслихата Павлодарской области от 30 сентября 2020 года № 486/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Железинского района
  kaz: Железинка ауданындағы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
