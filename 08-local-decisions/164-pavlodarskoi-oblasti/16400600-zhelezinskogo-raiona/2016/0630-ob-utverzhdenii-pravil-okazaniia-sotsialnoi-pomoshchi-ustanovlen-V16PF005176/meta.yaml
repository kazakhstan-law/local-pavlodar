  title:
    rus: О внесении изменений в решение Железинского районного маслихата от 30 июня 2016 года № 22/6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Железинского района»
    kaz: Железин аудандық мәслихатының 2016 жылғы 30 маусымдағы «Железинка ауданындағы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың   жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 22/6 шешіміне өзгерістер  енгізу туралы
