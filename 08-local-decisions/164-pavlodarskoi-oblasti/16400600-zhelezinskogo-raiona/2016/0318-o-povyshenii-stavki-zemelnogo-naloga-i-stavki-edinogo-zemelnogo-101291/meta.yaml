requisite: Решение маслихата Железинского района Павлодарской области от 18 марта 2016 года № 357-5/49. Зарегистрировано Департаментом юстиции Павлодарской области 15 апреля 2016 года № 5069. Утратило силу решением маслихата Железинского района Павлодарской области от 30 июня 2016 года N 26/6
title:
  rus: О повышении ставки земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Железинского района Павлодарской области
  kaz: Павлодар облысы Железин ауданының Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
