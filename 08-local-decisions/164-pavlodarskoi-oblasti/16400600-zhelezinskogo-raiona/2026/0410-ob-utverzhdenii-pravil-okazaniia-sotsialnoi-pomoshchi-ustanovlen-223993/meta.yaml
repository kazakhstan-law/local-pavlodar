  title:
    rus: О внесении изменений в решение Железинского районного маслихата от 10 апреля 2026 года № 230/8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Железинского района»
    kaz: Железин аудандық мәслихатының 2026 жылғы 10 сәуірдегі «Железин ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 230/8 шешіміне өзгерістер енгізу туралы
