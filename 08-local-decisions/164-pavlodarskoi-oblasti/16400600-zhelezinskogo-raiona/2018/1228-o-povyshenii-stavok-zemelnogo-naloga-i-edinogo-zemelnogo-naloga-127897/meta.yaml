requisite: Решение маслихата Железинского района Павлодарской области от 28 декабря 2018 года № 313/6. Зарегистрировано Департаментом юстиции Павлодарской области 29 декабря 2018 года № 6211. Утратило силу решением Железинского районного маслихата Павлодарской области от 26 октября 2022 года № 195/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставок земельного налога и единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Железинского района Павлодарской области
  kaz: Павлодар облысы Железин ауданының Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
