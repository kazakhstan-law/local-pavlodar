act_code: '55012'
requisite: Решение маслихата Железинского района Павлодарской области от 11 октября 2010 года № 225-4/28. Зарегистрировано Департаментом юстиции Павлодарской области 22 октября 2010 года № 12-6-97. Утратило силу решением маслихата Железинского района Павлодарской области от 14 июня 2013 года № 130-5/15
title:
  rus: Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) по оплате содержания жилища, потребления коммунальных услуг, услуг связи и компенсации затрат на отдельные виды капитального ремонта общего имущества объекта кондоминиума в Железинском районе
  kaz: (IV шақырылымның кезектен тыс XXVIII сессиясы) Железинка ауданында аз қамтылған отбасыларына (азаматтарға) тұрғын үй ұстауға, коммуналдық қызмет пен байланыс қызмет көрсетулерін тұтынуға және кондоминиум объектісінің ортақ мүлігін күрделі жөндеудің жекелеген түрлеріне шығын өтемақысын төлеу бойынша тұрғын үй көмегінің қағидасын бекіту туралы
