  title:
    rus: О внесении изменений в решение Железинского районного маслихата от 11 октября 2010 года № 225-4/28 "Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) по оплате содержания жилища, потребления коммунальных услуг, услуг связи и компенсации затрат на отдельные виды капитального ремонта общего имущества объекта кондоминиума в Железинском районе"
    kaz: Железинка аудандық мәслихатының 2010 жылғы 11 қазандағы № 225-4/28 "Железинка ауданында аз қамтылған отбасыларына (азаматтарға) тұрғын үй ұстауға, коммуналдық қызмет пен байланыс қызмет көрсетулерін тұтынуға және кондоминиум объектісінің ортақ мүлігін күрделі жөндеудің жекелеген түрлеріне шығын өтемақысын төлеу бойынша тұрғын үй көмегінің қағидасын бекіту туралы" шешіміне өзгерістер енгізу туралы
