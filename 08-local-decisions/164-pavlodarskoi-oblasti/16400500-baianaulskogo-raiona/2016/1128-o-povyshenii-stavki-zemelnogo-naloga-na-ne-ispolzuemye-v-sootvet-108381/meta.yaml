requisite: Решение маслихата Баянаульского района Павлодарской области от 28 ноября 2016 года № 55/11. Зарегистрировано Департаментом юстиции Павлодарской области 26 декабря 2016 года № 5309. Утратило силу решением маслихата Баянаульского района Павлодарской области от 25 ноября 2019 года № 287/50 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставки земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Баянаульского района Павлодарской области
