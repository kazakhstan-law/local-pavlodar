  title:
    rus: О внесении изменения в решение Баянаульского районного маслихата от 26 июля 2016 года № 25/05 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Баянаульского района»
    kaz: Баянауыл аудандық мәслихатының 2016 жылғы 20 шілдедегі «Баянауыл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» № 25/05 шешіміне өзгеріс енгізу туралы
