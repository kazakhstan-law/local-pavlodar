requisite: Решение маслихата Баянаульского района Павлодарской области от 04 апреля 2016 года № 11/02. Зарегистрировано Департаментом юстиции Павлодарской области 05 апреля 2016 года № 5048
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Баянаульского района на 2016 год
  kaz: 2016 жылға Баянауыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
