requisite: Павлодар облысы Баянауыл аудандық мәслихатының 2010 жылғы 9 маусымдағы № 166/25 шешімі. Павлодар облысының Әділет департаментінде 2010 жылғы 3 шілдеде № 12-5-79 тіркелген. Күші жойылды - Павлодар облысы Баянауыл аудандық мәслихатының 2012 жылғы 05 қарашадағы № 52/9 шешімімен
