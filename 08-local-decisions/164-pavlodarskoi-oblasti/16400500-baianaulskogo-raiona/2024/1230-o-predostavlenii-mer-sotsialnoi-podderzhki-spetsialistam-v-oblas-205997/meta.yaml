act_code: '205997'
requisite: Решение Баянаульского районного маслихата Павлодарской области от 30 декабря 2024 года № 267/28
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса и государственным служащим аппаратов акимов сел, поселков, сельского округа за исключением лиц занимающих руководящие должности, прибывшим для работы и проживания в сельские населенные пункты Баянаульского района на 2025 год
  kaz: 2025 жылға арналған Баянауыл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға және ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне басшылық лауазымдарды атқаратын адамдарды қоспағанда, әлеуметтік қолдау шараларын көрсету туралы
