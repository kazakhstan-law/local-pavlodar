  title:
    rus: О внесении изменения в решение Баянаульского районного маслихата от 22 августа 2024 года № 197/22 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Баянаульского района»
    kaz: Баянауыл аудандық мәслихатының 2024 жылғы 22 тамыздағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Баянауыл ауданы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 197/22 шешіміне өзгеріс енгізу туралы
