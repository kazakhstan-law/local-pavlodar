title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества на территории Бирликского сельского округа Баянаульского района Павлодарской области
  kaz: Павлодар облысы Баянауыл ауданының Бірлік ауылдық округі аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл және көше тұрғындары өкілдерінің сандық құрамын бекіту туралы
