requisite: Решение маслихата Баянаульского района Павлодарской области от 30 июля 2014 года N 201/36. Зарегистрировано Департаментом юстиции Павлодарской области 11 сентября 2014 года N 4005. Утратило силу решением маслихата Баянаульского района Павлодарской области от 6 мая 2019 года № 251/44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
