  title:
    rus: О внесении изменений в решение Баянаульского районного маслихата (внеочередная XXXII сессия V созыва) от 30 апреля 2014 года № 165/32 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Баянаульского района"
    kaz: Баянауыл аудандық мәслихатының (V сайланған кезектен тыс XXXII сессия) 2014 жылғы 30 сәуірдегі № 165/32 "Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Баянауыл ауданының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" шешіміне өзгерістер енгізу туралы
