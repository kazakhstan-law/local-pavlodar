act_code: '154849'
requisite: Решение Баянаульского районного маслихата Павлодарской области от 9 апреля 2021 года № 12/2. Зарегистрировано Департаментом юстиции Павлодарской области 19 апреля 2021 года № 7252
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Баянаульского района на 2021 год
  kaz: 2021 жылға арналған Баянауыл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы
