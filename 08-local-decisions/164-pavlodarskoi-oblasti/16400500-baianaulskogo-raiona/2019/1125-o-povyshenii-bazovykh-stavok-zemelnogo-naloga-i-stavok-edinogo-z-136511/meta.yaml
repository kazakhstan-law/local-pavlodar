requisite: Решение маслихата Баянаульского района Павлодарской области от 25 ноября 2019 года № 287/50. Зарегистрировано Департаментом юстиции Павлодарской области 28 ноября 2019 года № 6635. Утратило силу решением Баянаульского районного маслихата Павлодарской области от 18 октября 2022 года № 149/20 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
