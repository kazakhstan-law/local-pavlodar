requisite: Решение маслихата Баянаульского района Павлодарской области от 25 ноября 2019 года № 274/50. Зарегистрировано Департаментом юстиции Павлодарской области 28 ноября 2019 года № 6636
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Баянаульского района на 2019 год
  kaz: 2019 жылға арналған Баянауыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
