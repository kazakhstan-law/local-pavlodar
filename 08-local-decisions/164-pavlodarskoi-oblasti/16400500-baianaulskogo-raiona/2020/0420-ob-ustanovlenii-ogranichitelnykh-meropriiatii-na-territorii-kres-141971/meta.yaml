requisite: Решение акима Аксанского сельского округа Баянаульского района Павлодарской области от 20 апреля 2020 года № 1-04-02. Зарегистрировано Департаментом юстиции Павлодарской области 20 апреля 2020 года № 6801. Утратило силу решением акима Аксанского сельского округа Баянаульского района Павлодарской области от 14 августа 2020 года № 1-04-04 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
