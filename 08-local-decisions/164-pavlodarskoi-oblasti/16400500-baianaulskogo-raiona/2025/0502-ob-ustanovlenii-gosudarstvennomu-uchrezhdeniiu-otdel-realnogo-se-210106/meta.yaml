act_code: '210106'
requisite: Решение акима поселка Майкаин Баянаульского района Павлодарской области от 2 мая 2025 года № 1-22/07
title:
  rus: Об установлении государственному учреждению «Отдел реального сектора экономики Баянаульского района» публичный сервитут без права изъятия земельных участков у землепользователей, расположенных на территории поселка Майкаин Баянаульского района.
  kaz: «Баянауыл ауданының экономиканың нақты секторы бөлімі» мемлекеттік мекемесіне Баянауыл ауданы Майқайың кентінің аумағында орналасқан жер пайдаланушылардын жер учаскелерін алып қою құқығысыз сервитут белгілеу туралы
