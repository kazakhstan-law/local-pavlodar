  requisite: Решение Баянаульского районного маслихата Павлодарской области от 5 декабря 2024 года № 232/26
  title:
    rus: О внесении изменения в решение маслихата Баянаульского района от 21 декабря 2023 года № 88/12 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Баянаульского района на 2024 год»
    kaz: Баянауыл аудандық мәслихатының 2023 жылғы 21 желтоқсандағы «Баянауыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға арналған  әлеуметтік қолдау шараларын ұсыну туралы» № 88/12 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/203798/rus
