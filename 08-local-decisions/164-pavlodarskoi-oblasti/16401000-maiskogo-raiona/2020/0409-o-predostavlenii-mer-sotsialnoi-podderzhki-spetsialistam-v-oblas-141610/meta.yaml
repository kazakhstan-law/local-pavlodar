act_code: '141610'
requisite: Решение маслихата Майского района Павлодарской области от 9 апреля 2020 года № 7/58. Зарегистрировано Департаментом юстиции Павлодарской области 15 апреля 2020 года № 6797. Утратило силу решением  Майского районного маслихата Павлодарской области от 24 декабря 2020 года № 3/65 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Майского района на 2020 год
  kaz: 2020 жылға арналған Май ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
