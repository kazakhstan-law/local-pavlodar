act_code: '151171'
requisite: Решение Майского районного маслихата Павлодарской области от 29 декабря 2020 года № 2/66. Зарегистрировано Департаментом юстиции Павлодарской области 31 декабря 2020 года № 7144
title:
  rus: Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Майского района, а также указанным специалистам, работающим в государственных организациях, финансируемых из местного бюджета
  kaz: Азаматтық қызметшілер болып табылатын және Май ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттен қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
