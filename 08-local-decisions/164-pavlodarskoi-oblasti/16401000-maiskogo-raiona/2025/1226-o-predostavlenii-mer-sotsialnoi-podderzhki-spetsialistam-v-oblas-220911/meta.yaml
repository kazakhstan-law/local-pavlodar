act_code: '220911'
requisite: Решение Майского районного маслихата Павлодарской области от 26 декабря 2025 года № 14/35
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, ветеринарии и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Майского района в 2026 году
  kaz: 2026 жылы Май ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт, ветеринария және агроөнеркәсіптік кешен саласындағы мамандарға,ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдаушараларын ұсыну туралы
