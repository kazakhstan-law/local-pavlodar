requisite: Павлодар облысы Май аудандық мәслихатының 2006 жылғы 20 желтоқсандағы № 4/31 шешімі. Павлодар облысы Май ауданының Әділет басқармасында 2006 жылғы 26 желтоқсанда № 12-10-40 тіркелген
title:
