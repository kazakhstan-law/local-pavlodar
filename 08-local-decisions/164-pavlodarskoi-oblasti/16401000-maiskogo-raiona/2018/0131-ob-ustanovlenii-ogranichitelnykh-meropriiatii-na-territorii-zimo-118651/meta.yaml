requisite: Решение исполняющего обязанности акима Акшиманского сельского округа Майского района Павлодарской области от 31 января 2018 года № 1. Зарегистрировано Департаментом юстиции Павлодарской области 9 февраля 2018 года № 5847. Утратило силу решением акима Акшиманского сельского округа Майского района Павлодарской области от 27 марта 2019 года № 1 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории зимовки «Разведка» товарищества с ограниченной ответственностью Агрофирма «Ақжар Өндіріс», расположенного в Акшиманском сельском округе Майского района
  kaz: Май ауданы Ақшиман селолық округінде орналасқан «Ақжар Өндіріс» Агрофирмасы жауапкершілігі шектеулі серіктестігінің «Разведка» қыстағының аумағында шектеу іс-шараларын белгілеу туралы
