requisite: Решение маслихата Майского района Павлодарской области от 03 марта 2016 года № 2/59. Зарегистрировано Департаментом юстиции Павлодарской области 25 марта 2016 года № 5019. Утратило силу решением маслихата Майского района Павлодарской области от 12 февраля 2019 года № 1/44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставки земельного налога и единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Майского района Павлодарской области
  kaz: Павлодар облысы Май ауданының Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
