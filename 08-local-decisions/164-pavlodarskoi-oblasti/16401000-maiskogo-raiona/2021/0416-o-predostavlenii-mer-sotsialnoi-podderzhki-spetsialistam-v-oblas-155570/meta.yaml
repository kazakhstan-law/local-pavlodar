act_code: '155570'
requisite: Решение Майского районного маслихата Павлодарской области от 16 апреля 2021 года № 1/3. Зарегистрировано Департаментом юстиции Павлодарской области 5 мая 2021 года № 7271
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Майского района на 2021 год
  kaz: 2021 жылға арналған Май ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
