  title:
    rus: О внесении изменения в решение Майского районного маслихата от 16 апреля 2021 года № 2/3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Майского района»
    kaz: Май аудандық мәслихатының 2021 жылғы 16 сәуірдегі «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Май ауданы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 2/3 шешіміне өзгеріс енгізу туралы
