  requisite: Решение Майского районного маслихата Павлодарской области от 7 ноября 2024 года № 2/20
  title:
    rus: О внесении изменения в решение Майского районного маслихата от 27 декабря 2023 года № 2/7 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Майского района на 2024 год»
    kaz: Май аудандық мәслихатының 2023 жылғы 27 желтоқсандағы № 2/7 «2024 жылға арналған Май ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202432/rus
