act_code: '129198'
requisite: Решение маслихата Майского района Павлодарской области от 12 февраля 2019 года № 1/44. Зарегистрировано Департаментом юстиции Павлодарской области 21 февраля 2019 года № 6256. Утратило силу решением Майского районного маслихата Павлодарской области от 14 октября 2022 года № 2/19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога в десять раз на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Майского района Павлодарской области
  kaz: Павлодар облысы Май ауданының Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемесін он есеге жоғарылату туралы
