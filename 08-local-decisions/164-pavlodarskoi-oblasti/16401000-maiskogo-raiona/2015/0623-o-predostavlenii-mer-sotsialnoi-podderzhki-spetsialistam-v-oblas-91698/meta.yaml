act_code: '91698'
requisite: Решение от 23.06.2015 №2/49, Маслихат Майского района
title:
  rus: 'О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования,социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Майского района на 2015 год                '
  kaz: '2015 жылға арналған Май ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы '
