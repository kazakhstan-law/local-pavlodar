title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Майского района на 2014 год
  kaz: Май ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және аргоөнеркәсіптік кешен саласындағы мамандарына 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
