act_code: '141055'
requisite: Решение маслихата Актогайского района Павлодарской области от 26 марта 2020 года № 289/61. Зарегистрировано Департаментом юстиции Павлодарской области 3 апреля 2020 года № 6791. Утратило силу решением Актогайского районного маслихата Павлодарской области от 2 февраля 2022 года № 85/17 (ввводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Актогайского района
  kaz: Ақтоғай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы
