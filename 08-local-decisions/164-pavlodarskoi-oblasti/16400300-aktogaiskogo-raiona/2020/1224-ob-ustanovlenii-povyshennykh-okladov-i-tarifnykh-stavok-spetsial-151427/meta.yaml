act_code: '151427'
requisite: Решение Актогайского районного маслихата Павлодарской области от 24 декабря 2020 года № 336/72. Зарегистрировано Департаментом юстиции Павлодарской области 8 января 2021 года № 7160
title:
  rus: Об установлении повышенных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо  охраняемых природных территорий, являющимся гражданскими служащими  и работающим в сельских населенных пунктах Актогайского района, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов
  kaz: Азаматтық қызметшілер болып табылатын және Ақтоғай ауданы ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
