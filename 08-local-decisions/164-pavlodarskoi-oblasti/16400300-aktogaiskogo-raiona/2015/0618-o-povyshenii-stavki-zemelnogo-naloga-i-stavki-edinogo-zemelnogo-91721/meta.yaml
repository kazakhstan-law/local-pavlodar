  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Ақтоғай ауданының ауыл шаруашылығы мақсатындағы пайдаланылмайтын жерлердің жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жеті есе жоғарылату туралы
