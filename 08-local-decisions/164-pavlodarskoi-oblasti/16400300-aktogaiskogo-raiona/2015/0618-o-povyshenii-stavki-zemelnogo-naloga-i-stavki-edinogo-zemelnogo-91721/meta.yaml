requisite: Решение маслихата Актогайского района Павлодарской области от 18 июня 2015 года № 192/43. Зарегистрировано Департаментом юстиции Павлодарской области 14 июля 2015 года № 4597. Утратило силу решением маслихата Актогайского района Павлодарской области от 3 марта 2016 года № 246/57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
