requisite: Решение маслихата Актогайского района Павлодарской области от 24 июля 2014 года № 134/33. Зарегистрировано Департаментом юстиции Павлодарской области 13 августа 2014 года № 3915. Утратило силу решением маслихата Актогайского района Павлодарской области от 26 марта 2020 года № 289/61 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Актогайского района
  kaz: Ақтоғай ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
