  title:
    rus: О внесении изменений в решение Актогайского районного маслихата от 11 августа 2014 года № 148/35 «Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Разумовского сельского округа Актогайского района»
    kaz: Ақтоғай аудандық мәслихатының 2014 жылғы 11 тамыздағы «Ақтоғай ауданы Разумовка ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын бекіту туралы» № 148/35 шешіміне өзгерістер енгізу туралы
