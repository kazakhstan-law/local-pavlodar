title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории сельского округа Ақжол Актогайского района
  kaz: Ақтоғай ауданы Ақжол ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің санын бекіту туралы
