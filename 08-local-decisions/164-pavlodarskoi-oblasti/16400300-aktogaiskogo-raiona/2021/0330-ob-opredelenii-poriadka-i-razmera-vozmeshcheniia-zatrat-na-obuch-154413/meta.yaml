  title:
    rus: О внесении изменений и дополнения в решение Актогайского районного маслихата от 30 марта 2021 года № 17/4 «О возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Актогайском районе»
    kaz: Ақтоғай аудандық мәслихатының 2021 жылғы 30 наурыздағы № 17/4 «Ақтоғай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
