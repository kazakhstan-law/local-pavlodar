act_code: '154355'
requisite: Решение Актогайского районного маслихата Павлодарской области от 30 марта 2021 года № 18/4. Зарегистрировано Департаментом юстиции Павлодарской области 7 апреля 2021 года № 7238
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Актогайского района на 2021 год
  kaz: 2021 жылға арналған Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы
