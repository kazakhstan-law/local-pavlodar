  title:
    rus: О внесении изменений и дополнений в решение Актогайского районного маслихата от 9 апреля 2026 года № 262/49 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Актогайского района»
    kaz: Ақтоғай ауданындық мәслихатының 2026 жылғы 9 сәуірдегі «Ақтоғай ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 262/49 шешіміне өзгерістер мен толықтырулар еңгізу туралы
