act_code: '219434'
requisite: Решение Актогайского районного маслихата Павлодарской области от 24 декабря 2025 года № 247/44
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Актогайского района на 2026 год
  kaz: 2026 жылға арналған Ақтогай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы
