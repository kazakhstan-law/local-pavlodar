  title:
    rus: О внесении изменения в решение Актогайского районного маслихата от 3 апреля 2019 года № 236/47 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района на 2019 год»
    kaz: Ақтоғай аудандық мәслихатының 2019 жылғы 3 сәуірдегі «2019 жылға арналған Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 236/47 шешіміне өзгеріс енгізу туралы
