requisite: Решение Иртышского районного маслихата Павлодарской области от 10 ноября 2023 года № 35-10-8. Зарегистрировано в Департаменте юстиции Павлодарской области 17 ноября 2023 года № 7414-14. Утратило силу решением Иртышского районного маслихата Павлодарской области от 9 июня 2026 года № 175-57-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
