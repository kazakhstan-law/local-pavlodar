  title:
    rus: О внесении изменения и дополнения в решение Иртышского районного маслихата от 10 ноября 2023 года № 35-10-8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Иртышского района»
    kaz: Ертіс аудандық мәслихатының 2023 жылғы 10 қарашадағы № 35-10-8 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ертіс ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
