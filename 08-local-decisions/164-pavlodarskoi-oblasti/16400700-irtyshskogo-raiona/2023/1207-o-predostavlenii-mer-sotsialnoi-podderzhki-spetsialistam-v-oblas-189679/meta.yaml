  title:
    rus: О внесении изменения в решение Иртышского районного маслихата от 7 декабря 2023 года № 37-11-8 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Иртышского района на 2024 год»
    kaz: Ертіс аудандық мәслихатының 2023 жылғы 7 желтоқсандағы «2024 жылға арналған Ертіс ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы» № 37-11-8 шешіміне өзгеріс енгізу туралы
