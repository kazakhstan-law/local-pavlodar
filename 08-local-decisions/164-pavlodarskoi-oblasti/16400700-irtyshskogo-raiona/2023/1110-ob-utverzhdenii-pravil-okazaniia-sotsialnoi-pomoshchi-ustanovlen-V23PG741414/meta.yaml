  title:
    rus: О внесении изменения в решение Иртышского районного маслихата от 10 ноября 2023 года № 35-10-8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Иртышского района»
