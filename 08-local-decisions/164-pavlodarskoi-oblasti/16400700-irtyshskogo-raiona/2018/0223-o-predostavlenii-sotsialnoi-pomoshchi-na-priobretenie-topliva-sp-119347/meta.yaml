act_code: '119347'
requisite: Решение маслихата Иртышского района Павлодарской области от 23 февраля 2018 года № 120-23-6. Зарегистрировано Департаментом юстиции Павлодарской области 7 марта 2018 года № 5900. Утратило силу решением маслихата Иртышского района Павлодарской области от 30 декабря 2019 года № 215-51-6 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Иртышского района
  kaz: Ертіс ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
