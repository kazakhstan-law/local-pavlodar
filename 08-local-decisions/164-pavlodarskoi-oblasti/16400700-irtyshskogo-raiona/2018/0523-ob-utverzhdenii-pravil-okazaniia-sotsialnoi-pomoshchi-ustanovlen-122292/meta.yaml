  title:
    rus: О внесении изменений и дополнений в решение Иртышского районного маслихата от 23 мая 2018 года № 130-26-6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Иртышского района»
    kaz: Ертіс аудандық мәслихатының 2018 жылғы 23 мамырдағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ертіс ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 130-26-6 шешіміне өзгерістер мен толықтырулар енгізу туралы
