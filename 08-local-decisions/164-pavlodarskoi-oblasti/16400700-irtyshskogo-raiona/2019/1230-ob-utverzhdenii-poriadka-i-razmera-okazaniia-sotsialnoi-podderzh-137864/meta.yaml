  title:
    rus: О внесении изменения в решение Иртышского районного маслихата от 30 декабря 2019 года № 215-51-6 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Иртышского района»
    kaz: Ертіс аудандық мәслихатының 2019 жылғы 30 желтоқсандағы № 215-51-6 «Ертіс ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік амсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
