act_code: '140219'
requisite: Решение маслихата Иртышского района Павлодарской области от 3 марта 2020 года № 222-53-6. Зарегистрировано Департаментом юстиции Павлодарской области 13 марта 2020 года № 6746. Утратило силу решением Иртышского районного маслихата Павлодарской области от 28 декабря 2020 года № 272-62-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Иртышского района на 2020 год
  kaz: 2020 жылға арналған Ертіс ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
