  title:
    rus: О внесении изменения в решение Иртышского районного маслихата от 19 октября 2020 года № 245-58-6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Иртышского района»
    kaz: Ертіс аудандық мәслихатының 2020 жылғы 19 қазандағы № 245-58-6 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ертіс ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
