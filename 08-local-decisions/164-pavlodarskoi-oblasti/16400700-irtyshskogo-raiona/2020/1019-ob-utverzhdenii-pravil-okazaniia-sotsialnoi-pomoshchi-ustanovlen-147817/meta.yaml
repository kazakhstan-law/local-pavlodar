  title:
    rus: О внесении изменений и дополнений в решение Иртышского районного маслихата от 19 октября 2020 года № 245-58-6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Иртышского района»
    kaz: Ертіс аудандық мәслихатының 2020 жылғы 19 қазандағы «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және Ертіс ауданының мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың Қағидаларын бекіту туралы» № 245-58-6 шешіміне өзгерістер мен толықтырулар енгізу туралы
