requisite: Решение маслихата Иртышского района Павлодарской области от 20 апреля 2016 года № 12-3-6. Зарегистрировано Департаментом юстиции Павлодарской области 20 мая 2016 года № 5128. Утратило силу решением маслихата Иртышского района Павлодарской области от 23 мая 2018 года № 130-26-6 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
