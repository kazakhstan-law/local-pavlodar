requisite: Решение маслихата Иртышского района Павлодарской области от 5 сентября 2016 года № 22-5-6. Зарегистрировано Департаментом юстиции Павлодарской области 4 октября 2016 года № 5241. Утратило силу решением Иртышского районного маслихата Павлодарской области от 6 января 2021 года № 273-63-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
