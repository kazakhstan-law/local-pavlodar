requisite: Решение маслихата Иртышского района Павлодарской области от 07 декабря 2012 года № 52-13-5. Зарегистрировано Департаментом юстиции Павлодарской области 10 января 2013 года № 3324. Утратило силу решением маслихата Иртышского района Павлодарской области от 23 февраля 2018 года № 120-23-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
