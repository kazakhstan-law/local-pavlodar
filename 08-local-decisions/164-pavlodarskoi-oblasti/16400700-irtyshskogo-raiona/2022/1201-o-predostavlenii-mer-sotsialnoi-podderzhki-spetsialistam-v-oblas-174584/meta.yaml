  title:
    rus: О внесении изменения в решение Иртышского районного маслихата от 1 декабря 2022 года № 101-25-7 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Иртышского района на 2023 год»
    kaz: Ертіс аудандық мәслихатының 2022 жылғы 1 желтоқсандағы «2023 жылға арналған Ертіс ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы» № 101-25-7 шешіміне өзгеріс енгізу туралы
