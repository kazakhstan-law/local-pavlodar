act_code: '174584'
requisite: Решение Иртышского районного маслихата Павлодарской области от 1 декабря 2022 года № 101-25-7
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Иртышского района на 2023 год
  kaz: 2023 жылға арналған Ертіс ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы
