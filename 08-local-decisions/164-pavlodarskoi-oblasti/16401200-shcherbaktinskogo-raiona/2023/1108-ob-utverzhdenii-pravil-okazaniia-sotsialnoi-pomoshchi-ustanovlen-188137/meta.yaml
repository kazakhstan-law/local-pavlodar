  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 8 ноября 2023 года № 35/12 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Щербактинского района»
    kaz: Шарбақты аудандық мәслихатының 2023 жылғы 8 қарашадағы «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Шарбақты ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 35/12 шешіміне өзгеріс енгізу туралы
