  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 22 декабря 2023 года № 57/16 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Щербактинского района на 2024 год»
    kaz: Шарбақты аудандық мәслихатының 2023 жылғы 22 желтоқсандағы «2024 жылға арналған Шарбақты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы» № 57/16 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202852/rus
