  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 10 апреля 2026 года № 173/58 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Щербактинского района»
    kaz: Шарбақты аудандық мәслихатының 2026 жылғы 10 сәуірдегі «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Шарбақты ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 173/58 шешіміне өзгеріс енгізу туралы
