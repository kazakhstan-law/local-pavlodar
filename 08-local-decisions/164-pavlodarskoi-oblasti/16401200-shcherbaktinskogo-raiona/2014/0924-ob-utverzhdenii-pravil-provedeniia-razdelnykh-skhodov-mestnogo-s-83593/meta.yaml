requisite: Решение маслихата Щербактинского района Павлодарской области от 24 сентября 2014 года № 153/48. Зарегистрировано Департаментом юстиции Павлодарской области 08 октября 2014 года № 4075. Утратило силу решением маслихата Щербактинского района Павлодарской области от 19 июня 2019 года № 196/58 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Хмельницкого сельского округа Щербактинского района
  kaz: Шарбақты ауданы Хмельницкий ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдарының тұрғындары өкілдерінің санын бекіту туралы
