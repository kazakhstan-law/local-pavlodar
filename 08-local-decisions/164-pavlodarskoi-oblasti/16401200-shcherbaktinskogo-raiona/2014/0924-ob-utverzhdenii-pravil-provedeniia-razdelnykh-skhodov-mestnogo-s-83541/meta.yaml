requisite: Решение маслихата Щербактинского района Павлодарской области от 24 сентября 2014 года № 151/48. Зарегистрировано Департаментом юстиции Павлодарской области 8 октября 2014 года № 4064. Утратило силу решением маслихата Щербактинского района Павлодарской области от 7 декабря 2017 года № 104/31 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
