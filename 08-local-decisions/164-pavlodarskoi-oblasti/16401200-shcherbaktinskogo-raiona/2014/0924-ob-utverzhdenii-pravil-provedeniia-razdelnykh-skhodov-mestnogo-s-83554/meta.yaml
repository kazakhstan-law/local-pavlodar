requisite: Решение маслихата Щербактинского района Павлодарской области от 24 сентября 2014 года № 144/48. Зарегистрировано Департаментом юстиции Павлодарской области 08 октября 2014 года № 4069. Утратило силу решением Щербактинского районного маслихата Павлодарской области от 8 ноября 2023 года № 37/12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Александровского сельского округа Щербактинского района
  kaz: Шарбақты ауданы Александровка ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындау Қағидаларын бекіту туралы
