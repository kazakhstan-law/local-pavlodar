  title:
    rus: О внесении изменений в решение Щербактинского районного маслихата от 24 сентября 2014 года № 144/48 «Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Александровского сельского округа Щербактинского района»
    kaz: Шарбақты аудандық мәслихатының 2014 жылғы 24 қыркүйектегі № 144/48 «Шарбақты ауданы Александровка ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын бекіту туралы» шешіміне өзгерістер енгізу туралы
