requisite: Решение маслихата Щербактинского района Павлодарской области от 14 февраля 2019 года № 178/51. Зарегистрировано Департаментом юстиции Павлодарской области 19 февраля 2019 года № 6254
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Щербактинского района в 2019 году
  kaz: 2019 жылы Шарбақты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
