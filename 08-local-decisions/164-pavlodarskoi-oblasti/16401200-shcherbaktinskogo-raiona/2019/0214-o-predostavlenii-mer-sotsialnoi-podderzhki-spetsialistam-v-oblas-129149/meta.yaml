  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 14 февраля 2019 года № 178/51 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Щербактинского района в 2019 году»
    kaz: Шарбақты аудандық мәслихатының 2019 жылғы 14 ақпандағы «2019 жылы Шарбақты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 178/51 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134299/rus
