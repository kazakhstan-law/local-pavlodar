  title:
    rus: О внесении изменений в решение Щербактинского районного маслихата «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретения топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Щербактинского района» от 21 ноября 2019 года № 211/64
    kaz: Шарбақты аудандық мәслихатының 2019 жылғы 21 қарашадағы «Шарбақты ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» № 211/64 шешіміне өзгерістер енгізу туралы
