requisite: Решение маслихата Щербактинского района Павлодарской области от 7 декабря 2017 года № 103/31. Зарегистрировано Департаментом юстиции Павлодарской области 14 декабря 2017 года № 5737. Утратило силу решением Щербактинского районного маслихата Павлодарской области от 8 ноября 2023 года № 37/12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел для участия в сходе местного сообщества на территории Шарбактинского сельского округа Щербактинского района
  kaz: Шарбақты ауданы Шарбақты ауылдық округінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындау Қағидаларын бекіту туралы
