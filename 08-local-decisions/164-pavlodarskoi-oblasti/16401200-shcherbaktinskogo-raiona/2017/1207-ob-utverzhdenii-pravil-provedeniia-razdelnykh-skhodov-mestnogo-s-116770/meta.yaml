  title:
    rus: О внесении изменений в решение Щербактинского районного маслихата от 7 декабря 2017 года № 103/31 «Об утверждении Правил проведения раздельных сходов местного сообщества и количества представителей жителей сел для участия в сходе местного сообщества на территории Шарбактинского сельского округа Щербактинского района»
    kaz: Шарбақты аудандық мәслихатының 2017 жылғы 7 желтоқсандағы № 103/31 «Шарбақты ауданы Шарбақты ауылдық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын бекіту туралы» шешіміне өзгерістер енгізу туралы
