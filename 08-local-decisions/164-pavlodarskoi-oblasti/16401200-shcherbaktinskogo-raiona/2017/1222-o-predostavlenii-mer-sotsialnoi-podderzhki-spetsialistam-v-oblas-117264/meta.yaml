requisite: Решение маслихата Щербактинского района Павлодарской области от 22 декабря 2017 года № 109/32. Зарегистрировано Департаментом юстиции Павлодарской области 28 декабря 2017 года № 5766
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Щербактинского района в 2018 году
  kaz: 2018 жылға арналған Шарбақты ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
