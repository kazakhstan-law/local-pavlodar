  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 21 февраля 2017 года № 53/17 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания всельские населенные пункты Щербактинского района в 2017 году»
    kaz: Шарбақты аудандық мәслихатының 2017 жылғы 21 ақпандағы «2017 жылға арналған Шарбақты ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» № 53/17 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/112069/rus
