title:
  rus: О признании утратившим силу решения Щербактинского районного маслихата от 22 июня 2015 года № 219/61 «Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки в населенных пунктах Щербактинского района Павлодарской области»
  kaz: Шарбақты аудандық мәслихатының 2015 жылғы 22 маусымдағы «Павлодар облысы Шарбақты ауданының елді мекендерінде жер телімдері үшін бағалау аймақтарының шекараларын және төлемақы базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» № 219/61 шешімінің күші жойылды деп танылсын
