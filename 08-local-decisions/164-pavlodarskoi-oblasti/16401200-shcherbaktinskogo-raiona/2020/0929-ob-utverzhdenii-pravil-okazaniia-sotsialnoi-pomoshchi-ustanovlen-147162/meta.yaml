  title:
    rus: О внесении изменений в решение Щербактинского районного маслихата от 29 сентября 2020 года № 266/81 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Щербактинского района»
    kaz: Шарбақты аудандық мәслихатының 2020 жылғы 29 қыркүйектегі «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Шарбақты ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 266/81 шешіміне өзгерістер енгізу туралы
