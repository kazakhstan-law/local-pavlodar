  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 29 сентября 2020 года № 266/81 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Щербактинского района»
    kaz: Шарбақты аудандық мәслихатының 2020 жылғы 29 қыркүйектегі № 266/81 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Шарбақты ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
