act_code: '140419'
requisite: Решение маслихата Щербактинского района Павлодарской области от 13 марта 2020 года № 238/71. Зарегистрировано Департаментом юстиции Павлодарской области 19 марта 2020 года № 6758
title:
  rus: Об  установлении повышенных  окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, архивного дела, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими  и работающим в сельских населенных пунктах Щербактинского района
  kaz: Шарбақты ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, архив ісі, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға  жоғарылатылған айлықақылар мен тарифтік мөлшерлемелерін белгілеу туралы
