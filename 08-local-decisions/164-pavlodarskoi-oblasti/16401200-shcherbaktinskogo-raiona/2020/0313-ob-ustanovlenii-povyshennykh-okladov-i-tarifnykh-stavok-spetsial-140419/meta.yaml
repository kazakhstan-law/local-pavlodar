  requisite: Решение Щербактинского районного маслихата Павлодарской области от 22 июня 2026 года № 187/63
  title:
    rus: О внесении изменения и дополнений в решение Щербактинского районного маслихата Павлодарской области от 13 марта 2020 года № 238/71 «Об установлении повышенных  окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Щербактинского района»
    kaz: Павлодар облысының Шарбақты аудандық мәслихатының 2020 жылғы 13 аурыздағы «Шарбақты ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға  жоғарылатылған айлықақылар мен тарифтік мөлшерлемелерін белгілеу туралы» № 238/71 шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226701/rus
