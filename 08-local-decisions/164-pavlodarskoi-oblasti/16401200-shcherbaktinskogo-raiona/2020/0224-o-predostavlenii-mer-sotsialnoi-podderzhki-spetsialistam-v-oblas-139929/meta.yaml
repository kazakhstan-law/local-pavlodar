requisite: Решение маслихата Щербактинского района Павлодарской области от 24 февраля 2020 года № 235/70. Зарегистрировано Департаментом юстиции Павлодарской области 2 марта 2020 года № 6736. Утратило силу решением Щербактинского районного маслихата Павлодарской области от 11 декабря 2020 года № 282/83 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Щербактинского района на 2020 год
  kaz: 2020 жылға арналған Шарбақты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
