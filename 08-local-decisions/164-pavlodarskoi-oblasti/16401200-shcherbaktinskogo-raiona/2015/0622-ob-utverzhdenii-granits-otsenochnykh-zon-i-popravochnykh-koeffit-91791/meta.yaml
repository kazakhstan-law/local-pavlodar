requisite: Решение маслихата Щербактинского района Павлодарской области от 22 июня 2015 года № 219/61. Зарегистрировано Департаментом юстиции Павлодарской области 16 июля 2015 года № 4609. Утратило силу решением маслихата Щербактинского района Павлодарской области от 4 февраля 2020 года № 229/69 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки в населенных пунктах Щербактинского района Павлодарской области
  kaz: Павлодар облысы Шарбақты ауданының елді мекендерінде жер телімдері үшін бағалау аймақтарының шекараларын және төлемақы базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы
