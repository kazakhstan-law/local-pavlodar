requisite: Решение маслихата Щербактинского района Павлодарской области от 8 июня 2018 года № 134/39. Зарегистрировано Департаментом юстиции Павлодарской области 25 июня 2018 года № 6000. Утратило силу решением Щербактинского районного маслихата Павлодарской области от 26 сентября 2022 года № 119/33 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставок земельного налога и единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Щербактинского района Павлодарской области
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Шарбақты ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
