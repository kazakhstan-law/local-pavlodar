  title:
    rus: О внесении изменения в решение Щербактинского районного маслихата от 8 января 2021 года № 289/86 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, норм их предельной заполняемости, а также требований к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования в Щербактинском районе»
    kaz: Шарбақты аудандық мәслихатының 2021 жылғы 8 қаңтардағы «Шарбақты ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» № 289/86 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/192888/rus
