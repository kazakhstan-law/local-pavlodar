  title:
    rus: О внесении изменений в решение Щербактинского районного маслихата от 16 ноября 2021 года № 56/17 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Щербактинском районе»
    kaz: Шарбақты аудандық мәслихатының «Шарбақты ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» 2021 жылғы 16 қарашадағы № 56/17 шешіміне өзгерістер енгізу туралы
