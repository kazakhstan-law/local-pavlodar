act_code: '154845'
requisite: Решение Щербактинского районного маслихата Павлодарской области от 6 апреля 2021 года № 20/5. Зарегистрировано Департаментом юстиции Павлодарской области 19 апреля 2021 года № 7251
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Щербактинского района на 2021 год
  kaz: 2021 жылға арналған Шарбақты ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
